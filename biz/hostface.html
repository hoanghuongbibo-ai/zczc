<!doctype html><meta charset="utf-8"><canvas id="stage" width="1600" height="900"></canvas>
<script src="../houdini/js/toon.js"></script><script src="js/host.js"></script>
<script>
const c = document.getElementById('stage'), g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 1600, 900);
const F = [['neutral',{}],['smile',{mouth:'smile'}],['open (talking)',{mouth:'open'}],['talk loud',{},1],['laugh',{mouth:'laugh',eyes:'happy'}],['surprised',{mouth:'o',brows:'up'}],['worried',{mouth:'frown',brows:'worried'}],['skeptic',{mouth:'flat',brows:'skeptic',eyes:'side'}],['angry',{mouth:'frown',brows:'angry'}],['scared',{mouth:'scared',brows:'worried'}],['smirk',{mouth:'smirk',brows:'skeptic'}],['wink',{mouth:'open',eyes:'wink'}]];
F.forEach(([n, f, tk], i) => { const cx = 200 + (i % 6) * 240, cy = 30 + Math.floor(i / 6) * 440; g.save(); g.beginPath(); g.rect(cx - 115, cy, 230, 400); g.clip(); Host.draw(g, cx, cy + 720, 1.3, { pose: 'idle', t: 2, face: f, talk: tk || 0 }); g.restore(); g.font = '22px sans-serif'; g.fillStyle = '#333'; g.textAlign = 'center'; g.fillText(n, cx, cy + 425); });
window.DONE = true;
</script>
