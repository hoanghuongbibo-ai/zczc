<!doctype html><meta charset="utf-8">
<style>@font-face { font-family: Fredoka; font-weight: 700; src: url(../assets/fonts/fredoka-latin-700-normal.woff2); }</style>
<canvas id="c" width="2600" height="1500"></canvas>
<script src="../js/toon.js"></script><script src="../js/guide.js"></script><script src="../js/wardrobe.js"></script><script src="js/cast.js"></script>
<script>
Guide.setTheme('warm');
const c = document.getElementById('c'), g = c.getContext('2d'), D = Guide.draw, V = CW;
const label = (t, x, y) => { g.font = '700 26px Fredoka'; g.fillStyle = '#3a2519'; g.textAlign = 'center'; g.fillText(t, x, y); };
document.fonts.load('700 30px Fredoka').then(() => {
  g.fillStyle = '#f2e2c4'; g.fillRect(0, 0, 2600, 1500);
  const rows = [[['Theo (trail)', 'theoCow', 'thumbsUp'], ['the extra (17)', 'cowhand', 'shrug'], ['gunslinger', 'gun1', 'hips'], ['lawman', 'gun2', 'crossed'], ['director', 'director', 'present'], ['Cookie', 'cook', 'idle'], ['trail boss', 'boss', 'hips'], ['wrangler', 'wrangler', 'idle']],
    [['vaquero', 'vaquero', 'wave'], ['freedman', 'freed', 'idle'], ['veteran', 'vet', 'idle'], ['Bose Ikard', 'ikard', 'idle'], ['Goodnight', 'goodnight', 'present'], ['Nat Love', 'natlove', 'cheer'], ['Bill Pickett', 'pickett', 'hips'], ['Roosevelt', 'teddy', 'present'], ['riding club', 'rider1', 'wave']]];
  rows.forEach((row, ri) => row.forEach(([n, k, pose], i) => { const x = 150 + i * (ri ? 288 : 320), y = ri ? 1420 : 700; D(g, x, y, .85, Object.assign({ t: i, noBlink: true, pose, face: { mouth: 'smile' }, turn: i % 2 ? .2 : -.2 }, V[k])); label(n, x, y + 40); }));
  window.DONE = true;
});
</script>
