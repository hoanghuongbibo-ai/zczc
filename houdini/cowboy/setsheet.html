<script>
window.addEventListener('load', () => setTimeout(() => Promise.all([document.fonts.load('700 30px Fredoka'), document.fonts.load('40px "Luckiest Guy"')]).then(() => {
const c = document.getElementById('c'), g = c.getContext('2d'), off = document.createElement('canvas'); off.width = 1280; off.height = 720; const o = off.getContext('2d'), t = 3;
const list = [x => CS.movieSet(x, t, 0, { crew: true }), x => CS.prairie(x, t, 0, { v: 'noon' }), x => CS.prairie(x, t, 0, { v: 'night' }), x => CS.prairie(x, t, 0, { v: 'storm', flash: .0 }), x => CS.prairie(x, t, 0, { v: 'snow' }), x => CS.studio(x, t, 0),

window.DONE = true; }), 50));
