<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The War of Jenkins' Ear</title>
<style>
  @font-face { font-family: "Permanent Marker"; src: url(../canada/assets/fonts/PermanentMarker-Regular.ttf); }
  @font-face { font-family: "Luckiest Guy"; src: url(../assets/fonts/luckiest-guy-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Fredoka; font-weight: 700; src: url(../assets/fonts/fredoka-latin-700-normal.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: "DejaVu Sans", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #stage { width: min(100vw, calc((100vh - 70px) * 16 / 9)); aspect-ratio: 16 / 9; display: block; }
  button { font: inherit; padding: 8px 18px; border-radius: 6px; border: 2px solid #eee; background: #5c1f1b; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1300"></canvas>
<div><button id="play">▶ Play</button><span id="time"></span></div>
<script>window.RENDER_SCALE = 1.5; window.TOON_FINISH = { grain: 0, vignette: 0 }; window.FIG_DETAIL = true; window.FULL_FILM = true;
window.FILM_CFG = { narration: 'jenkins/assets/audio/narration-full.mp3', openUntil: 0, meterLabel: 'WAR FEVER', meterInvert: true, meterStart: 0, meterIcon: (c, lv, t) => { c.fillStyle = lv > .7 ? '#ff5a3a' : '#ffd040'; c.beginPath(); c.arc(0, 0, 14, 0, 7); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 3; c.stroke(); c.fillStyle = '#2a1e18'; c.font = '20px "Luckiest Guy"'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('!', 0, 2); },
  tracker: ['HOW DOES ONE ', 'EAR', ' START A WAR?'], badgeIcon: (c, t) => { G_JAR(c, t); } };
window.G_JAR = (c, t) => { if (window.JE) { c.save(); c.scale(.32, .32); c.translate(0, 40); JE.jar(c, 0, 0, 1, t, {}); c.restore(); } };</script>
<script src="../js/toon.js"></script>
<script src="../js/sound.js"></script>
<script src="../canada/js/foley.js"></script>
<script src="../rome/js/paint.js"></script>
<script src="../rome/js/monk.js"></script>
<script src="../rome/js/animals.js"></script>
<script src="../rome/js/cine.js"></script>
<script src="../rome/js/kit.js"></script>
<script src="../usa/js/cast.js"></script>
<script src="../canada/js/geo.js"></script>
<script src="../canada/js/collage.js"></script>
<script src="../canada/js/scenes.js"></script>
<script src="../canada/js/type.js"></script>
<script src="../usa/js/sets.js"></script>
<script src="../sketch/js/rig.js"></script>
<script src="../sketch/js/cast.js"></script>
<script src="../sketch/js/world.js"></script>
<script src="../sketch/js/ui.js"></script>
<script src="js/timing.js"></script>
<script src="../sketch/js/props.js"></script>
<script src="../sketch/js/ui2.js"></script>
<script src="../sketch/js/sets2.js"></script>
<script src="../sketch/js/horse.js"></script>
<script src="../sketch/js/film2.js"></script>
<script src="../sketch/js/ck.js"></script>
<script src="../sketch/js/life.js"></script>
<script src="js/cast-je.js"></script>
<script src="js/sets-je.js"></script>
<script src="js/kit-je.js"></script>
<script>
window.draw = (t) => { const cv = document.getElementById('c'), x = cv.getContext('2d'); x.setTransform(1,0,0,1,0,0); x.fillStyle = '#efe4c8'; x.fillRect(0,0,1920,1300); const P = JEP;
  const rows = [[['Robert Jenkins', P.jenkins(2001, true), {arms:'hold', face:'stern'}], ['Fandiño', P.fandino(), {arms:'point', face:'angry'}], ['Guarda costa', P.guarda(2003), {arms:'side', face:'angry'}], ['Sailor', P.sailor(2004), {arms:'side', face:'neutral'}], ['Walpole', P.walpole(), {arms:'hip', face:'smile'}], ['MP', P.mp(2006), {arms:'shout', face:'angry'}], ['MP', P.mp(2008), {arms:'point', face:'win'}], ['Speaker', P.speaker(), {arms:'side', face:'tired'}], ['George II', P.george(), {arms:'side', face:'stern'}]],
   [['Philip V', P.philip(), {arms:'cross', face:'stern'}], ['Vernon', P.vernon(), {arms:'side', face:'win'}], ['"Old Grog"', P.vernon(2010, true), {arms:'hip', face:'smile'}], ['Blas de Lezo', P.lezo(), {arms:'side', face:'stern'}], ['Eslava', P.eslava(), {arms:'cross', face:'stern'}], ['Wentworth', P.wentworth(), {arms:'cross', face:'angry'}], ['L. Washington', P.lawrence(), {arms:'side', face:'neutral'}], ['You (Virginia)', P.youVA(), {arms:'port', face:'cold'}], ['Spanish soldier', P.spanish(2017), {arms:'port', face:'stern'}]],
   [['Jemmy (Cato)', P.jemmy(), {arms:'side', face:'stern'}], ['Stono', P.rebel(2020), {arms:'side', face:'stern'}], ['F. Menéndez', P.menendez(), {arms:'point', face:'stern'}], ['Fort Mose', P.mose(2023), {arms:'side', face:'neutral'}], ['Fort Mose', P.moseWoman(2024), {arms:'side', face:'smile'}], ['Oglethorpe', P.oglethorpe(), {arms:'point', face:'win'}], ['Native ally', P.native(2026), {arms:'side', face:'neutral'}], ['Anson', P.anson(), {arms:'side', face:'win'}], ['Carlyle', P.carlyle(), {arms:'side', face:'neutral'}]]];
  rows.forEach((r, j) => r.forEach(([n, p, o], i) => { const X = 110 + i * 212, Y = 380 + j * 420; p.draw(x, X, Y, 1.05, t, o); x.fillStyle = '#2b1d16'; x.font = '24px "Luckiest Guy"'; x.textAlign = 'center'; x.fillText(n, X, Y + 40); }));
  JE.jar(x, 1840, 1260, 1.4, t, {glow: .6});
  return cv.toDataURL('image/png'); };
</script></body></html>
