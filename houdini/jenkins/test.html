<script>
window.draw = (t) => { const cv = document.getElementById('c'), x = cv.getContext('2d'), S = Sets2; x.setTransform(1,0,0,1,0,0); x.fillStyle='#efe4c8'; x.fillRect(0,0,1920,1080); const J = JS, P = JEP;
 const cell = (i, f) => { x.save(); x.translate((i%3)*640, Math.floor(i/3)*360); x.scale(.5,.5); x.beginPath(); x.rect(0,0,1280,720); x.clip(); f(); x.restore(); };
 cell(0, () => { J.commons(x,t,{papers:true}); });
 cell(1, () => { J.sky(x,t,'day',400); J.sea(x,t,400,{}); J.ship(x,500,480,.8,t,{kind:'line'}); J.ship(x,1050,450,.5,t,{kind:'galleon',flag:'burgundy',flip:true}); J.longboat(x,300,640,.8,t,P.crowd(5,[P.guarda],1),{flag:'burgundy'}); });
 cell(2, () => { J.deck(x,t,{}); });
 cell(3, () => { J.london(x,t,{}); });
 cell(4, () => { J.carolina(x,t,{}); });
 cell(5, () => { J.tropic(x,t,{town:640, forts:[[300,380,.4],[1000,370,.35]]}); J.ship(x,640,520,.5,t,{kind:'line'}); });
 cell(6, () => { J.camp(x,t,{}); J.cot(x,400,640,1,P.colonial(5),t,{}); });
 cell(7, () => { J.mose(x,t,{}); });
 cell(8, () => { J.office(x,t,{globe:800}); J.desk(x,640,700,420,1); J.mountVernon(x,1100,300,.3,t); });
 return cv.toDataURL('image/png'); };
