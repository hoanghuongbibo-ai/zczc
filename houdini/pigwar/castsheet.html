<script>(async()=>{ await document.fonts.load('40px "Luckiest Guy"'); await document.fonts.load('700 20px Fredoka'); const c=document.getElementById('c'),ctx=c.getContext('2d'); ctx.fillStyle='#e8ecd8'; ctx.fillRect(0,0,1920,1300); const P=window.PWP,t=1.3;
ctx.fillStyle='#2a1e18'; ctx.font='48px "Luckiest Guy"'; ctx.fillText('THE PIG WAR — CAST',40,70);
const cast=[['you','YOU (a settler)'],['cutlar','LYMAN CUTLAR'],['griffin','CHARLES GRIFFIN'],['hbcHand','HBC FARMHAND'],['sheriff','THE SHERIFF (1855)'],['harney','GEN. HARNEY'],['pickett','CAPT. PICKETT'],['usSoldier','9TH INFANTRY'],['casey','LT. COL. CASEY'],['douglas','GOV. DOUGLAS'],['hornby','CAPT. HORNBY'],['baynes','R. ADM. BAYNES'],['marine','ROYAL MARINE'],['sailor','RN SAILOR'],['scott','GEN. W. SCOTT'],['buchanan','PRES. BUCHANAN'],['salish','COAST SALISH'],['kaiser','KAISER WILHELM I'],['commissioner','GENEVA COMMISSION'],['pickettCS','PICKETT (1863)'],['confed','CONFEDERATE'],['union','UNION'],['ranger','PARK RANGER'],['tourist','TOURIST'],['settler','SETTLER'],['settlerWoman','SETTLER']];
cast.forEach(([k,n],i)=>{ const x=90+(i%13)*142, y=420+Math.floor(i/13)*400; const f=P[k](); f.draw(ctx,x,y,.55,t,{arms:k==='cutlar'?'port':k==='hornby'?'shout':undefined,face:['harney','douglas'].includes(k)?'stern':undefined}); ctx.fillStyle='#2a1e18'; ctx.font='700 15px Fredoka'; ctx.textAlign='center'; ctx.fillText(n,x,y+26); });
PW.pig(ctx,330,1260,1.2,t,{tag:true}); ctx.fillText('THE PIG (HBC boar)',330,1290); PW.ghostPig(ctx,660,1250,.9,t); ctx.fillText('"STILL DEAD" GAG',660,1290); PW.eagle(ctx,880,1250,1.2,t,{perch:true}); S2=window.Sets2; S2.sheep(ctx,1020,1260,1,t,1); PW.canoe(ctx,1350,1250,.8,t,[P.salish(5),P.salish(6),P.salish(7)]); for(let i=0;i<3;i++) PW.potato(ctx,1620+i*80,1260,1,t,i); ctx.fillText('POTATOES',1700,1290);
window.READY=true; })();</script></body></html>
