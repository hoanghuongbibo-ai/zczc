<!doctype html><html><head><meta charset="utf-8"><title>Cast sheet</title></head><body style="margin:0;background:#111">

<script>
const P = Paint, ctx = document.getElementById('c').getContext('2d');
function draw(t) { ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#efe2c8'; ctx.fillRect(0, 0, 1600, 900); ctx.fillStyle = '#c9b08a'; ctx.fillRect(0, 430, 1600, 30); ctx.fillRect(0, 860, 1600, 40);

  const row2 = [['tourist photo', {kind:'tourist', cloth:'#3a6ab8', cap:'#e84a3a', hair:'#d8b878', pose:'photo', seed:1}], ['tourist wave', {kind:'tourist', cloth:'#f6c945', cloth2:'#3a4a6a', hairStyle:'long', hair:'#2a1a14', pose:'wave', eyes:'happy', mouth:'grin', seed:4, fem:true}], ['tourist walk', {kind:'tourist', cloth:'#3a8a5a', hairStyle:'curly', hair:'#1a1410', pose:'walk', seed:2, face:1}], ['commoner', {kind:'tunic', cloth:'#c87a4a', hairStyle:'curly', hair:'#2a1a14', pose:'up', mouth:'o', eyes:'wide', seed:8}], ['monk haul', {kind:'monk', pose:'haul', brow:'angry'}], ['monk stand', {kind:'monk', pose:'stand', mouth:'smile'}]];

  row2.forEach(([n, o], i) => { P.person(ctx, 110 + i * 225, 860, .78, t, o); ctx.fillStyle = '#333'; ctx.font = '700 20px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(n, 110 + i * 225, 885); });
  ctx.drawImage(REF, 180, 120, 340, 600, 1390, 470, 200, 353); }
