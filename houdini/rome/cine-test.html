<!doctype html><html><head><meta charset="utf-8"><title>Cine test</title></head><body style="margin:0;background:#111">
<canvas id="c" width="1280" height="720"></canvas>
<script src="../js/toon.js"></script><script src="js/paint.js"></script><script src="js/monk.js"></script><script src="js/animals.js"></script><script src="js/cine.js"></script>
<script>
const P = Paint, C = Cine, ctx = document.getElementById('c').getContext('2d');
function draw(t) { ctx.setTransform(1,0,0,1,0,0); const cam = C.cam(1, 4, { x: -30, z: 1 }, { x: 30, z: 1.06 });
  C.layer(ctx, cam, .05, () => C.sky(ctx, 'golden', t, { horizon: 400, sun: [700, 300], sunR: 46, seed: 4 }));
  C.layer(ctx, cam, .15, () => C.mounds(ctx, { y: 400, n: 5, seed: 2, col: '#8aa070', far: .5, sunX: 700, t, w: 620, h: 120, copses: 2 }));
  C.layer(ctx, cam, .3, () => C.mounds(ctx, { y: 470, n: 4, seed: 5, col: '#7e9c48', far: .25, sunX: 700, t, w: 560, h: 170, copses: 3 }));
  C.layer(ctx, cam, .5, () => C.mounds(ctx, { y: 540, n: 4, seed: 8, col: '#76963e', far: .05, sunX: 700, t, w: 640, h: 180, copses: 3 }));
  C.layer(ctx, cam, .7, () => { C.water(ctx, -300, 560, 1600, 630, t, { sunX: 700 }); C.copse(ctx, 120, 566, .4, t, { n: 7 }); C.copse(ctx, 980, 570, .38, t, { n: 6 }); });
  C.layer(ctx, cam, 1, () => { C.meadow(ctx, 626, 760, t, { col: '#7a9a36', n: 400 }); P.person(ctx, 640, 700, .3, t, { kind: 'monk', pose: 'walk', face: 1 }); });
  C.layer(ctx, cam, 1.3, () => C.foreground(ctx, t, { reeds: true }));
  C.rays(ctx, 700, 300, t, .1); C.motes(ctx, t); C.finish(ctx, t, 'golden'); }
draw(2); window.READY = true; window.draw = draw;
</script></body></html>
