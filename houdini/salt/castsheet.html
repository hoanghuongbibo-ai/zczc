<!doctype html>
<html><head><meta charset="utf-8"><title>Salt cast sheet</title>
<style>@font-face { font-family: Fredoka; font-weight: 700; src: url(../assets/fonts/fredoka-latin-700-normal.woff2); }
@font-face { font-family: 'Luckiest Guy'; src: url(../assets/fonts/luckiest-guy-latin-400-normal.woff2); } body { margin: 0; background: #222; }</style></head>
<body><canvas id="c" width="2400" height="2200"></canvas>
<script src="../js/toon.js"></script><script src="../js/common.js"></script><script src="../js/guide.js"></script><script src="../js/wardrobe.js"></script>
<script src="../js/paint.js"></script><script src="../js/paint2.js"></script>
<script src="../vindolanda/js/cast.js"></script><script src="../vindolanda/js/kit.js"></script><script src="../merer/js/cast.js"></script><script src="../toilet/js/cast.js"></script><script src="js/cast.js"></script>
<script>
(async () => {
  await document.fonts.load('700 30px Fredoka'); await document.fonts.load('60px "Luckiest Guy"');
  const G = window, c = document.getElementById("c"), g = c.getContext("2d"), Gd = G.Guide;
  const bg = g.createLinearGradient(0, 0, 0, 2200); bg.addColorStop(0, '#f6ead2'); bg.addColorStop(1, '#e2cfa8'); g.fillStyle = bg; g.fillRect(0, 0, 2400, 2200);
  g.font = '60px "Luckiest Guy"'; g.fillStyle = '#3a2618'; g.textAlign = 'center'; g.fillText("IT'S ABOUT SALT — CAST", 1200, 80);
  const row = (list, y, s) => list.forEach(([key, label, o], i) => { const x = 140 + i * (2120 / (list.length - 1));
    if (key === 'shaker') G.shaker(g, x, y, 1.3, Object.assign({ t: 1 }, o)); else Gd.draw(g, x, y, s, Object.assign({ t: 1, pose: 'idle' }, G.CW[key] || {}, o || {}, { look: Object.assign({}, (G.CW[key] || {}).look) }));
    g.font = '700 28px Fredoka'; g.fillStyle = '#3a2618'; g.fillText(label, x, y + 44); });
  row([['shaker', 'Salt Shaker', {}], ['shaker', '…in Beat 8', { glasses: true, coat: true, face: 'happy' }], ['wudi', 'Emperor Wu (Han Wudi)', { face: { mouth: 'smirk', brows: 'sly' } }], ['hanAdv', 'Advisor', { pose: 'present' }], ['sang', 'Sang Hongyang', {}], ['huan', 'Huan Kuan', {}], ['scholar', 'Confucian scholar', { face: { mouth: 'frown', brows: 'worried' } }], ['merchant', 'Salt & iron merchant', { face: { mouth: 'grin', eyes: 'happy' } }]], 640, .62);
  row([['miner', 'Hallstatt miner', {}], ['miner2', 'Hallstatt miner 2', {}], ['pliny', 'Pliny the Elder', { pose: 'present' }], ['legion', 'Roman soldier', {}], ['peasant', 'French peasant', { pose: 'shrug', face: { mouth: 'frown', brows: 'worried' } }], ['taxman', 'Salt-tax collector', { face: { mouth: 'grin', brows: 'sly' } }], ['smuggler', 'Salt smuggler', {}], ['noble', 'Noble (exempt)', { face: { mouth: 'smirk', eyes: 'half' } }]], 1280, .62);
  row([['jefferson', 'Thomas Jefferson', { pose: 'shrug', face: { mouth: 'smirk', brows: 'skeptic' } }], ['uscav', '5th U.S. Colored Cavalry', {}], ['uscav2', '5th USCC 2', {}], ['burbridge', 'Gen. Burbridge', {}], ['stoneman', 'Gen. Stoneman', {}], ['confed', 'Confederate militia', {}], ['gandhi', 'Gandhi', { face: { mouth: 'smile' } }], ['marcher', 'Salt March volunteer', {}], ['irwin', 'Lord Irwin', { face: { mouth: 'flat' } }], ['cowie', 'Dr David M. Cowie', { pose: 'present', face: { mouth: 'smile' } }], ['driver', 'Plough driver', {}]], 1960, .6);
  window.DONE = true;
})();
</script></body></html>
