<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch asset sheet</title>
<style>
  @font-face { font-family: "Permanent Marker"; src: url(../canada/assets/fonts/PermanentMarker-Regular.ttf); }
  @font-face { font-family: "Luckiest Guy"; src: url(../assets/fonts/luckiest-guy-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Fredoka; font-weight: 700; src: url(../assets/fonts/fredoka-latin-700-normal.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: "DejaVu Sans", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #stage { width: min(100vw, calc((100vh - 70px) * 16 / 9)); aspect-ratio: 16 / 9; display: block; }
  button { font: inherit; padding: 8px 18px; border-radius: 6px; border: 2px solid #eee; background: #5c1f1b; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="2080"></canvas><script>window.FIG_DETAIL = true;</script>
<script>window.TOON_FINISH = { grain: 0, vignette: 0 };</script>
<script src="../js/toon.js"></script>
<script src="../js/sound.js"></script>
<script src="../canada/js/foley.js"></script>
<script src="../rome/js/paint.js"></script>
<script src="../rome/js/monk.js"></script>
<script src="../rome/js/animals.js"></script>
<script src="../rome/js/cine.js"></script>
<script src="../rome/js/kit.js"></script>
<script src="../usa/js/cast.js"></script>
<script src="../canada/js/geo.js"></script>
<script src="../canada/js/collage.js"></script>
<script src="../canada/js/scenes.js"></script>
<script src="../canada/js/type.js"></script>
<script src="../usa/js/sets.js"></script>
<script src="js/rig.js"></script>
<script src="js/world.js"></script>
<script src="js/ui.js"></script>
<script src="js/shots.js"></script>
<script>
(async () => { await Promise.all(['700 20px Fredoka','20px "Luckiest Guy"','20px "Permanent Marker"'].map(f => document.fonts.load(f)));
const c = document.getElementById('c'), x = c.getContext('2d'), R = Rig, W = World, t = 1.3, K = SketchCast;
x.fillStyle = '#ece6d8'; x.fillRect(0, 0, 1920, 2080);
const title = (s, y) => { x.fillStyle = '#2a1a10'; x.font = '44px "Luckiest Guy"'; x.textAlign = 'left'; x.fillText(s, 40, y); x.fillRect(40, y + 10, 1840, 4); };
const cell = (cx, cy, label, fn, w = 220) => { x.fillStyle = '#f8f4ec'; x.fillRect(cx - w / 2, cy - 150, w, 210); x.strokeStyle = '#b8ac94'; x.lineWidth = 2; x.strokeRect(cx - w / 2, cy - 150, w, 210); x.save(); fn(cx, cy); x.restore(); x.fillStyle = '#2a1a10'; x.font = '700 16px Fredoka'; x.textAlign = 'center'; x.fillText(label, cx, cy + 50); };
title('1 · YOU — the channel character, and HIS OWN separate props', 70);
cell(150, 300, 'YOU (body)', (cx, cy) => Col.fig(x, cx, cy + 30, .4, t, Object.assign({}, CAST.you, { pose: 'crossed', still: true, speak: false })));
cell(380, 300, 'his musket', (cx, cy) => K.YOU.musket.draw(x, cx - 70, cy + 20, 1.05, .52));
cell(610, 300, 'his lantern', (cx, cy) => K.YOU.lantern.draw(x, cx, cy - 110, 1.4, t, { noGlow: true }));
cell(840, 300, 'his old shoe', (cx, cy) => K.SHOE.draw(x, cx, cy - 20, .95, t));
cell(1070, 300, 'rag wraps', (cx, cy) => { for (const sx of [-1, 1]) { x.save(); x.translate(cx + sx * 40, cy - 20); R.shape(x, cc => cc.ellipse(0, 0, 32, 18, 0, 0, 7), '#b8ac94', { lw: 4, shade: '#8a7e68', dx: 6 }); x.restore(); } });
cell(1300, 300, 'post lantern (not his)', (cx, cy) => K.POST_LANTERN.draw(x, cx, cy - 110, 1.4, t, { noGlow: true }));
cell(1580, 300, 'ASSEMBLED', (cx, cy) => K.YOU.draw(x, cx, cy + 30, .4, t, {}), 300);
title('2 · EVERY SOLDIER OWNS HIS OWN MUSKET (separate instances)', 470);
for (let i = 0; i < 4; i++) { const p = K.LINE[i === 3 ? 5 : i], cx = 140 + i * 230; cell(cx, 710, `soldier ${i + 1}`, () => p.draw(x, cx, 740, .4, t, {})); cell(cx + 920, 710, `soldier ${i + 1}'s musket`, () => p.musket.draw(x, cx + 920 - 70, 730, 1.05, .52)); }
title('3 · REDCOATS: each grenadier with his own musket', 880);
for (let i = 0; i < 4; i++) { const p = K.GREN[i], cx = 140 + i * 230; cell(cx, 1120, `redcoat ${i + 1}`, () => p.draw(x, cx, 1150, .4, t, { mood: 'angry' })); cell(cx + 920, 1120, `redcoat ${i + 1}'s musket`, () => p.musket.draw(x, cx + 920 - 70, 1140, 1.05, .52)); }
title('4 · HANDS & HATS (detail mode)', 1290);
const hk = [['relaxed', 'stand'], ['gripping a musket', 'hold'], ['open', 'shrug'], ['pointing', 'point'], ['crossed', 'crossed']];
hk.forEach(([n, pose], i) => cell(140 + i * 230, 1530, n, (cx, cy) => { x.save(); x.beginPath(); x.rect(cx - 110, cy - 150, 220, 180); x.clip(); x.translate(cx, cy - 40); x.scale(1.5, 1.5); x.translate(-cx, -cy); Col.fig(x, cx, cy + 120, .5, t, Object.assign({}, CAST.you, { pose, still: true, speak: false, prop: pose === 'hold' ? (cc) => K.YOU.musket.draw(cc, 0, 62, -.06, .34) : undefined })); x.restore(); }));
const hats = [['felt tricorne + cockade', { hat: 'tricorne' }], ['grenadier bearskin', { hat: 'bearskin' }], ['knitted cap', { hat: 'knit' }], ['wool mittens', { gloves: '#7a6a58', pose: 'shrug' }]];
hats.forEach(([n, h], i) => cell(1300 + (i % 2) * 260, 1340 + Math.floor(i / 2) * 230 + 70, n, (cx, cy) => Col.fig(x, cx, cy + 34, .38, t, Object.assign({}, PEOPLE.ragged(2), { pose: 'stand', still: true, speak: false }, h)), 240));
title('5 · NATURE & ANIMALS (each its own asset)', 1720);
const nat = [['BARE OAK + OAK LEAVES', () => W.bareTree(x, 140, 2000, .55, t, 7, { h: 120, w: 12, col: '#2a2a34', snow: true })], ['WHITE PINE', () => W.pine(x, 355, 2000, 1.4, '#2a3a3a', { snow: true })], ['REEDS / CATTAILS', () => W.reeds(x, 570, 2000, .65, t, 3, { snow: true })], ['AMERICAN HOLLY', () => W.holly(x, 785, 2000, 1.1, t, 2)], ['AMERICAN CROW', () => W.crow(x, 1000, 1980, 1.3, t, { seed: 1 })], ['BARRED OWL', () => W.owl(x, 1215, 1990, 1.4, t)], ['RED FOX', () => W.fox(x, 1430, 1990, 1.3, t)], ['HORSE', () => W.horse(x, 1640, 2000, .65, t, { breath: false })], ['CAMP DOG', () => W.dog(x, 1860, 1990, .9, t)]];
nat.forEach(([n, fn], i) => cell(140 + i * 215, 1990, n, fn)); cell(1000 + 0, 1800, '', () => {}, 0);
window.READY = true; })();
</script></body></html>
