<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The American Revolution — Full Film</title>
<style>
  @font-face { font-family: "Permanent Marker"; src: url(../canada/assets/fonts/PermanentMarker-Regular.ttf); }
  @font-face { font-family: "Luckiest Guy"; src: url(../assets/fonts/luckiest-guy-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Fredoka; font-weight: 700; src: url(../assets/fonts/fredoka-latin-700-normal.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: "DejaVu Sans", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #stage { width: min(100vw, calc((100vh - 70px) * 16 / 9)); aspect-ratio: 16 / 9; display: block; }
  button { font: inherit; padding: 8px 18px; border-radius: 6px; border: 2px solid #eee; background: #5c1f1b; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="2160"></canvas>

<script>window.TOON_FINISH = { grain: 0, vignette: 0 }; window.FIG_DETAIL = true; window.FULL_FILM = true;</script>
<script src="../js/toon.js"></script>
<script src="../js/sound.js"></script>
<script src="../canada/js/foley.js"></script>
<script src="../rome/js/paint.js"></script>
<script src="../rome/js/monk.js"></script>
<script src="../rome/js/animals.js"></script>
<script src="../rome/js/cine.js"></script>
<script src="../rome/js/kit.js"></script>
<script src="../usa/js/cast.js"></script>
<script src="../canada/js/geo.js"></script>
<script src="../canada/js/collage.js"></script>
<script src="../canada/js/scenes.js"></script>
<script src="../canada/js/type.js"></script>
<script src="../usa/js/sets.js"></script>
<script src="js/rig.js"></script>
<script src="js/cast.js"></script>
<script src="js/world.js"></script>
<script src="js/ui.js"></script>
<script src="../usa/js/timing.js"></script>
<script src="js/props.js"></script>
<script src="js/ui2.js"></script>
<script src="js/sets2.js"></script>
<script src="js/shots.js"></script><script src="js/film2.js"></script><script src="js/ck.js"></script><script>
(async()=>{ await document.fonts.load('40px "Luckiest Guy"'); await document.fonts.load('700 20px Fredoka');
const c=document.getElementById('c'),ctx=c.getContext('2d'); ctx.fillStyle='#cfd8e0'; ctx.fillRect(0,0,1920,2160); const P=G2=window.P2, S=window.Sets2, t=1.3;
const names=Object.keys(P).filter(k=>!['crowd'].includes(k)); let i=0;
console.log('start');for(const n of names){console.log('fig '+n); const x=90+(i%16)*115, y=300+Math.floor(i/16)*330; const f=P[n](); f.draw(ctx,x,y,.42,t,{arms: n==='clinton'||n==='dunmore'?'hold':n==='revere'?'side':undefined}); ctx.fillStyle='#000'; ctx.font='700 14px Fredoka'; ctx.textAlign='center'; ctx.fillText(n,x,y+20); i++; }
const poses=['side','point','up','hold','hip','shrug','wave','shout','fist','cross','port']; poses.forEach((p,j)=>{console.log('pose '+p); const f=P.washington(); f.draw(ctx,90+j*160,1260,.5,t,{arms:p}); ctx.fillStyle='#000'; ctx.fillText(p,90+j*160,1280); });
const panel=(x,y,fn)=>{console.log('panel '+x+','+y); ctx.save(); ctx.beginPath(); ctx.rect(x,y,640,360); ctx.clip(); ctx.translate(x,y); ctx.scale(.5,.5); fn(); ctx.restore(); };
panel(0,1340,()=>{ S.sky(ctx,t,'spring',{sun:[1000,140]}); S.hills(ctx,430,'#7aa85a',3,50); S.ground(ctx,520,'#8ab85a'); S.farmhouse(ctx,820,560,1,t); S.barn(ctx,1150,560,.9,{}); S.tree(ctx,300,600,1.1,t,3,{kind:'apple',season:'spring',blossom:true}); S.wall(ctx,640,-100,1500,1); S.cow(ctx,560,700,.9,t); S.chicken(ctx,760,700,1,t,1); S.chicken(ctx,820,710,1,t,2); S.goose(ctx,200,720,1,t); S.sheep(ctx,1000,720,1,t); S.meadow(ctx,600,760,t); });
panel(640,1340,()=>{ S.sky(ctx,t,'autumn'); S.ground(ctx,520,'#a89a5a'); for(let k=0;k<6;k++) S.tree(ctx,k*240,620,1,t,k,{kind:k%2?'maple':'oak',season:'autumn',falling:true}); S.deer(ctx,600,700,1,t,{buck:true}); S.squirrel(ctx,900,700,1.4,t); S.longhouse(ctx,300,640,.9,t); S.corn(ctx,1100,720,1,t); S.tobacco(ctx,1200,720,1,t); });
panel(1280,1340,()=>{ S.sky(ctx,t,'tropic',{sun:[1100,120]}); S.sea(ctx,420,t); S.palm(ctx,150,700,1.2,t,2); S.ship(ctx,700,470,.5,t,'fr'); S.pelican(ctx,400,200,1,t); S.gull(ctx,900,180,1,t); S.hulk(ctx,1050,560,.6,t); S.greyhound(ctx,700,700,1.2,t,{run:true}); });
panel(0,1700,()=>{ S.room(ctx,t,{window:1000,hearth:300,sky:'night'}); S.table(ctx,700,480,400,{cloth:'#6a2a2a'}); S.candle(ctx,700,480,t); S.barrel(ctx,1150,700,1); });
panel(640,1700,()=>{ S.sky(ctx,t,'day'); S.ground(ctx,560,'#9a8a6a'); S.stateHouse(ctx,640,600,.9,t); S.church(ctx,1150,600,.7,t,{lanterns:true}); S.street(ctx,560,t,{seed:3}); });
panel(1280,1700,()=>{ S.sky(ctx,t,'winter'); CK.snowGround(ctx,520,t); for(let k=0;k<4;k++) S.hut(ctx,150+k*330,600+k%2*40,.9,t,{snow:true}); S.earthwork(ctx,720,100,900,'#8a7050',{abatis:true,gabions:true}); S.cannon(ctx,1100,700,1,t,{fireAt:1}); window.CK.rider(ctx,P.revere(),640,560,1,t,{gallop:true}); });
window.READY=true; })();
</script></body></html>
