<!doctype html><meta charset="utf-8">
<canvas id="c" width="1100" height="1500"></canvas>
<script src="../js/chars.js"></script>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const img = new Image(); img.src = '../assets/img/houdini-suit.png';
img.onload = () => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, 1100, 1500);
  g.drawImage(img, 0, 20);                                         // reference on the left
  g.save(); g.translate(533 + 266 + 20, 1461 + 20);                 // rebuild on the right
  Chars.figure(g, { hands: { L: [-26, -800], R: [26, -800] }, handShape: { L: 'open', R: 'open' }, feet: { L: [-115, -40], R: [115, -40] } });
  g.restore();
  g.globalAlpha = .45; g.drawImage(img, 533 + 20, 20); g.globalAlpha = 1;  // ghost of the reference over the rebuild
  window.DONE = true;
};
</script>
