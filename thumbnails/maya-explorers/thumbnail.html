<!doctype html><meta charset="utf-8">
<style>@font-face { font-family: Lucky; src: url(luckiest-guy-latin-400-normal.woff2); } body { margin: 0; background: #111; }</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../lib/toon.js"></script>
<script>
/* Maya explorers: four travellers peer over a mossy boulder at a jungle-swallowed pyramid. Their
 * leader, in a big feather headdress, shades his eyes and shouts; a woman with a staff, a young
 * man and a bearded torch-bearer back him up. A carved stone face watches from the right.
 * Redrawn from the user's reference in the channel's flat ink style. */
const T = Toon(document.getElementById('c'), 97), { g, W, H, INK, ink, line, ell, rr, lg, rg, fill } = T;
const SKIN = '#fbf7ef', GOLD = '#e0a43a', GOLDL = '#f2c860', RED = '#c7322a', TEAL = '#2a9a8a', CREAM = '#efe2c4';

// ---------------- scenery ----------------
function sky() {
  g.fillStyle = lg(0, 0, 0, 700, [[0, '#4aa8e6'], [.6, '#9fd6f2'], [1, '#e8f4e0']]); g.fillRect(0, 0, W, H);
  g.save(); g.globalCompositeOperation = 'screen';
  for (let i = 0; i < 7; i++) { const x = 1700 + i * 60; T.P(c => { c.moveTo(x, -20); c.lineTo(x + 60, -20); c.lineTo(x - 360, 900); c.lineTo(x - 480, 900); c.closePath(); }); g.fillStyle = 'rgba(255,245,200,.14)'; g.fill(); }
  g.restore();
  const cloud = (x, y, s) => [[0, 0, 90, 34], [-70, 12, 60, 26], [70, 10, 70, 28], [10, -26, 56, 34]].forEach(([dx, dy, rx, ry]) => fill(ell(x + dx * s, y + dy * s, rx * s, ry * s), '#ffffff'));
  [[1080, 110, 1.1], [1560, 60, .9], [620, 70, .8]].forEach(([x, y, s]) => cloud(x, y, s));
}
function hills() {
  // layered canopy, misty toward the back
  [[520, '#9cc48a', 60, 70], [600, '#7aae68', 50, 80], [700, '#5a9450', 40, 90]].forEach(([y, col, amp, r0]) => {
    g.fillStyle = col; T.P(c => { c.moveTo(0, H); c.lineTo(0, y); for (let x = 0; x <= W + r0; x += r0) c.arc(x, y - T.rnd() * amp, r0 * (.7 + T.rnd() * .5), Math.PI, 0); c.lineTo(W, H); c.closePath(); }); g.fill();
  });
  g.fillStyle = lg(0, 560, 0, 760, [[0, 'rgba(240,245,225,0)'], [.5, 'rgba(240,245,225,.45)'], [1, 'rgba(240,245,225,0)']]); g.fillRect(0, 560, W, 200);
}
function pyramid() {
  const cx = 1520, base = 760, w = 600, tiers = 7, th = 78, stone = '#c8b48c', dark = '#9c8662';
  for (let i = 0; i < tiers; i++) {
    const tw = w * (1 - i / tiers * .6), y = base - (i + 1) * th;
    ink(c => { c.moveTo(cx - tw / 2, y + th); c.lineTo(cx - tw / 2 + 12, y); c.lineTo(cx + tw / 2 - 12, y); c.lineTo(cx + tw / 2, y + th); c.closePath(); }, stone, 5);
    fill(c => { c.moveTo(cx + tw / 2, y + th); c.lineTo(cx + tw / 2 - 12, y); c.lineTo(cx + tw / 2 - 70, y); c.lineTo(cx + tw / 2 - 60, y + th); c.closePath(); }, 'rgba(90,70,40,.28)');
    for (let k = 0; k < 7; k++) fill(ell(cx - tw / 2 + T.rnd() * tw, y + 4, 20 + T.rnd() * 34, 8), 'rgba(80,130,50,.8)');
    for (let k = 0; k < 5; k++) { const bx = cx - tw / 2 + 30 + T.rnd() * (tw - 60); T.line([[bx, y + 20], [bx + 30, y + 20]], 3, 'rgba(90,70,40,.45)'); }
  }
  const top = base - tiers * th;
  ink(c => { c.moveTo(cx - 70, base); c.lineTo(cx - 40, top); c.lineTo(cx + 40, top); c.lineTo(cx + 70, base); c.closePath(); }, '#d8c59a', 5);
  for (let y = top + 10; y < base; y += 16) T.line([[cx - 40 - (y - top) * .055, y], [cx + 40 + (y - top) * .055, y]], 2.5, 'rgba(90,70,40,.5)');
  ink(rr(cx - 110, top - 150, 220, 152, 4), stone, 5);
  ink(rr(cx - 34, top - 100, 68, 102, 6), '#2a1f14', 4);
  ink(rr(cx - 80, top - 220, 160, 74, 6), stone, 5);
  for (let i = 0; i < 4; i++) ink(rr(cx - 66 + i * 36, top - 204, 24, 40, 5), dark, 3);
  // vines hanging down the tiers
  [[cx - 220, base - 5 * th, 260], [cx + 160, base - 6 * th, 300], [cx - 90, top - 140, 200], [cx + 250, base - 3 * th, 160]].forEach(([x, y, l]) => { g.strokeStyle = '#3f7a32'; g.lineWidth = 7; T.P(c => { c.moveTo(x, y); c.bezierCurveTo(x + 20, y + l * .3, x - 20, y + l * .6, x + 6, y + l); }); g.stroke(); for (let k = .15; k < 1; k += .2) fill(ell(x + Math.sin(k * 9) * 12, y + l * k, 10, 6, .6), '#5ea048'); });
  g.fillStyle = 'rgba(240,245,225,.2)'; g.fillRect(cx - w / 2, top - 230, w, base - top + 230);
}
function macaw(x, y, s, r) {
  g.save(); g.translate(x, y); g.rotate(r); g.scale(s, s);
  ink(c => { c.moveTo(-10, 0); c.quadraticCurveTo(-80, -70, -150, -50); c.quadraticCurveTo(-90, -10, -10, 10); c.closePath(); }, '#2f62b8', 4);
  ink(c => { c.moveTo(-10, 0); c.quadraticCurveTo(-60, -30, -110, -20); c.quadraticCurveTo(-60, 0, -10, 8); c.closePath(); }, '#f2c344', 3);
  ink(ell(0, 0, 40, 18), '#d6281e', 4);
  ink(c => { c.moveTo(-36, 4); c.lineTo(-110, 40); c.lineTo(-30, 14); c.closePath(); }, '#d6281e', 3);
  ink(c => { c.moveTo(10, -6); c.quadraticCurveTo(80, -80, 140, -60); c.quadraticCurveTo(80, -20, 20, 6); c.closePath(); }, '#d6281e', 4);
  ink(ell(38, -6, 16, 14), '#d6281e', 3); fill(ell(42, -8, 5, 5), '#fff'); fill(ell(43, -8, 2.5, 2.5), INK);
  ink(c => { c.moveTo(50, -10); c.quadraticCurveTo(66, -6, 60, 8); c.quadraticCurveTo(54, 0, 48, 0); c.closePath(); }, '#eee2c8', 2);
  g.restore();
}
function trees() {
  // big trunk top-left with lianas
  ink(c => { c.moveTo(-20, 700); c.quadraticCurveTo(80, 450, 120, 200); c.quadraticCurveTo(140, 80, 110, -20); c.lineTo(260, -20); c.quadraticCurveTo(240, 200, 200, 330); c.quadraticCurveTo(150, 520, 160, 720); c.closePath(); }, '#6b4a2e', 7);
  fill(c => c.rect(180, -20, 50, 720), 'rgba(40,20,5,.2)');
  for (let y = 40; y < 640; y += 80) T.line([[110, y], [140, y + 26]], 4, 'rgba(40,20,5,.45)');
  [[60, 30, 160], [260, -10, 150], [430, -40, 120], [-30, 200, 120], [560, -50, 90]].forEach(([x, y, r]) => ink(ell(x, y, r, r * .8), '#4f8a3a', 6));
  [[50, 0, 90], [240, -30, 80], [420, -50, 60]].forEach(([x, y, r]) => fill(ell(x, y, r, r * .6), 'rgba(150,210,100,.45)'));
  [[330, 360], [520, 300], [700, 200], [1900, 380], [1780, 300]].forEach(([x, l]) => { g.strokeStyle = '#2f5a26'; g.lineWidth = 8; T.P(c => { c.moveTo(x, -10); c.bezierCurveTo(x + 40, l * .4, x - 40, l * .7, x + 10, l); }); g.stroke(); fill(ell(x + 10, l, 14, 22, .3), '#3f7a32'); });
  // canopy top-right
  [[1840, 40, 150], [1700, -20, 120], [1960, 200, 140]].forEach(([x, y, r]) => ink(ell(x, y, r, r * .8), '#4f8a3a', 6));
}
function stoneFace() {
  // carved monumental face, half-swallowed by moss, on the right
  const x = 1560, y = 560, w = 380, h = 480, st = '#a39a82', dk = '#7c735e';
  ink(rr(x, y, w, h, 20), st, 7);
  fill(rr(x + w - 70, y + 10, 64, h - 20, 14), 'rgba(50,45,30,.25)');
  for (let r = 0; r < 2; r++) for (let k = 0; k < 4; k++) ink(rr(x + 30 + k * 82, y + 24 + r * 66, 70, 56, 14), '#b4ab92', 3);
  // the face: heavy brow, glaring eyes, flat nose, open mouth
  ink(rr(x + 70, y + 170, 240, 270, 30), '#b8af96', 5);
  ink(rr(x + 90, y + 200, 90, 44, 10), dk, 4); ink(rr(x + 200, y + 200, 90, 44, 10), dk, 4);
  fill(ell(x + 135, y + 222, 16, 14), '#3a3428'); fill(ell(x + 245, y + 222, 16, 14), '#3a3428');
  ink(c => { c.moveTo(x + 170, y + 260); c.lineTo(x + 210, y + 260); c.lineTo(x + 226, y + 330); c.lineTo(x + 154, y + 330); c.closePath(); }, '#ada48a', 4);
  ink(rr(x + 130, y + 360, 120, 50, 12), '#3a3428', 5);
  for (let k = 0; k < 4; k++) T.line([[x + 150 + k * 26, y + 362], [x + 150 + k * 26, y + 380]], 4, '#d8d0b8');
  [[x + 20, y + 10, 90], [x + 300, y + 140, 70], [x + 40, y + 420, 80], [x + 330, y + 400, 60]].forEach(([mx, my, r]) => fill(ell(mx, my, r, r * .5), 'rgba(80,130,50,.85)'));
}
function boulder() {
  ink(c => { c.moveTo(200, H + 20); c.quadraticCurveTo(300, 860, 620, 820); c.quadraticCurveTo(1000, 780, 1260, 880); c.quadraticCurveTo(1420, 940, 1460, H + 20); c.closePath(); }, '#7a7a62', 8);
  fill(c => { c.moveTo(260, H); c.quadraticCurveTo(330, 870, 620, 836); c.quadraticCurveTo(1000, 800, 1250, 892); c.quadraticCurveTo(1100, 860, 900, 860); c.quadraticCurveTo(500, 870, 260, H); c.closePath(); }, '#5e9a44');
  for (let i = 0; i < 40; i++) fill(ell(300 + T.rnd() * 1100, 860 + T.rnd() * 200, 10 + T.rnd() * 30, 4 + T.rnd() * 10), T.rnd() > .5 ? 'rgba(80,130,50,.7)' : 'rgba(60,60,45,.4)');
}
function leaves() {
  const leaf = (x, y, len, wid, ang, col) => { g.save(); g.translate(x, y); g.rotate(ang); ink(c => { c.moveTo(0, 0); c.bezierCurveTo(len * .3, -wid, len * .8, -wid * .8, len, 0); c.bezierCurveTo(len * .8, wid * .8, len * .3, wid, 0, 0); c.closePath(); }, col, 6); T.line([[0, 0], [len * .96, 0]], 4, 'rgba(15,45,15,.6)'); for (let k = .15; k < .9; k += .14) { T.line([[len * k, 0], [len * (k + .1), -wid * .55]], 2.5, 'rgba(15,45,15,.6)'); T.line([[len * k, 0], [len * (k + .1), wid * .55]], 2.5, 'rgba(15,45,15,.6)'); } g.restore(); };
  leaf(-60, 1100, 380, 110, -.45, '#2f6f2e');
  leaf(1990, 1110, 360, 110, Math.PI + .35, '#2f6f2e');
}

// ---------------- the explorers ----------------
function earSpool(x, y, r) { ink(ell(x, y, r, r), GOLD, 5); ink(ell(x, y, r * .55, r * .55), GOLDL, 3); fill(ell(x, y, r * .2, r * .2), '#7a5216'); }
function beads(x0, x1, y, sag, n, cols) { for (let k = 0; k < n; k++) { const t = k / (n - 1), x = x0 + (x1 - x0) * t, yy = y + Math.sin(t * Math.PI) * sag; ink(ell(x, yy, 10, 10), cols[k % cols.length], 3); } }
function face(hx, hy, r, look, mouth) {
  const k = r / 170;
  T.line([[hx - 100 * k + look * 16 * k, hy - 26 * k], [hx - 18 * k + look * 16 * k, hy + 6 * k]], 13 * k + 3);
  T.line([[hx + 18 * k + look * 16 * k, hy + 6 * k], [hx + 100 * k + look * 16 * k, hy - 26 * k]], 13 * k + 3);
  T.eye(hx - 52 * k + look * 18 * k, hy + 34 * k, 30 * k, 30 * k, look * 12 * k, 0, .45);
  T.eye(hx + 58 * k + look * 18 * k, hy + 34 * k, 30 * k, 30 * k, look * 12 * k, 0, .45);
  const mx = hx + look * 26 * k;
  if (mouth === 'shout') { ink(ell(mx, hy + 118 * k, 34 * k, 30 * k), '#7a2420', 5); fill(ell(mx, hy + 132 * k, 20 * k, 10 * k), '#e8726a'); }
  else T.line([[mx - 28 * k, hy + 120 * k], [mx, hy + 110 * k], [mx + 28 * k, hy + 120 * k]], 9 * k + 2);
}
function woman() {
  const hx = 330, hy = 400, r = 100;
  // staff
  ink(rr(110, 360, 26, 520, 10), '#8a5a32', 5);
  ink(c => { c.moveTo(200, 860); c.quadraticCurveTo(200, 560, 330, 540); c.quadraticCurveTo(470, 560, 480, 860); c.closePath(); }, CREAM, 6);
  T.line([[220, 620], [460, 620]], 16, RED); T.line([[220, 620], [460, 620]], 0.1);
  beads(250, 410, 560, 50, 9, ['#e0a43a', TEAL, RED]);
  T.line([[230, 600], [170, 640], [126, 600]], 34); T.line([[230, 600], [170, 640], [126, 600]], 20, SKIN);
  ink(ell(124, 580, 28, 26), SKIN, 5);
  ink(rr(150, 630, 50, 26, 10), GOLD, 4);
  // long black hair behind
  ink(c => { c.moveTo(hx - 110, hy - 40); c.quadraticCurveTo(hx - 140, hy + 120, hx - 100, hy + 160); c.lineTo(hx + 100, hy + 160); c.quadraticCurveTo(hx + 140, hy + 120, hx + 110, hy - 40); c.closePath(); }, '#2a1e1a', 5);
  T.head(hx, hy, r);
  ink(c => { c.moveTo(hx - 110, hy - 10); c.quadraticCurveTo(hx - 100, hy - 130, hx, hy - 136); c.quadraticCurveTo(hx + 100, hy - 130, hx + 110, hy - 10); c.quadraticCurveTo(hx + 40, hy - 80, hx - 110, hy - 10); c.closePath(); }, '#2a1e1a', 5);
  earSpool(hx - 100, hy + 40, 22); earSpool(hx + 104, hy + 40, 22);
  face(hx, hy, r, 1, 'flat');
  // headband + small feather fan
  [[-.6, RED], [-.3, TEAL], [0, '#f2a43a'], [.3, TEAL], [.6, RED]].forEach(([a, col]) => { g.save(); g.translate(hx - 40, hy - 100); g.rotate(a - .3); ink(c => { c.moveTo(0, 0); c.quadraticCurveTo(-20, -70, 0, -130); c.quadraticCurveTo(20, -70, 0, 0); c.closePath(); }, col, 4); g.restore(); });
  ink(rr(hx - 112, hy - 92, 224, 34, 12), GOLD, 5);
  for (let k = 0; k < 6; k++) fill(rr(hx - 96 + k * 34, hy - 84, 18, 18, 3), RED);
}
function youngMan() {
  const hx = 360, hy = 720, r = 108;
  // bundle on his back
  ink(ell(180, 760, 110, 90), '#9a6a3a', 6); T.line([[100, 720], [260, 800]], 6, '#5a3a22');
  ink(c => { c.moveTo(200, H + 20); c.quadraticCurveTo(220, 840, 360, 830); c.quadraticCurveTo(500, 840, 540, H + 20); c.closePath(); }, CREAM, 6);
  beads(280, 450, 850, 40, 8, [TEAL, '#4cc08a']);
  // spiky black hair
  ink(c => { c.moveTo(hx - 120, hy - 20); for (let k = 0; k < 9; k++) { const a = Math.PI + k / 8 * Math.PI; c.lineTo(hx + Math.cos(a) * (130 + (k % 2) * 40), hy - 30 + Math.sin(a) * (110 + (k % 2) * 40)); } c.lineTo(hx + 120, hy - 20); c.closePath(); }, '#241a16', 5);
  T.head(hx, hy, r);
  earSpool(hx - 104, hy + 50, 26);
  face(hx, hy, r, 1, 'shout');
  ink(rr(hx - 120, hy - 70, 240, 40, 14), RED, 5);
  for (let k = 0; k < 6; k++) fill(c => { const x = hx - 100 + k * 38; c.moveTo(x, hy - 50); c.lineTo(x + 12, hy - 64); c.lineTo(x + 24, hy - 50); c.lineTo(x + 12, hy - 36); c.closePath(); }, GOLDL);
  ink(c => { c.moveTo(hx + 116, hy - 60); c.quadraticCurveTo(hx + 170, hy - 50, hx + 190, hy - 10); c.lineTo(hx + 160, hy - 10); c.quadraticCurveTo(hx + 150, hy - 40, hx + 116, hy - 36); c.closePath(); }, RED, 4);
}
function bearded() {
  const hx = 1250, hy = 700, r = 100;
  ink(c => { c.moveTo(1080, 960); c.quadraticCurveTo(1100, 800, 1250, 790); c.quadraticCurveTo(1400, 800, 1420, 960); c.closePath(); }, '#2f6f9a', 6);
  ink(c => { c.moveTo(1150, 800); c.quadraticCurveTo(1250, 870, 1350, 800); c.quadraticCurveTo(1250, 830, 1150, 800); c.closePath(); }, GOLD, 5);
  for (let k = 0; k < 5; k++) T.line([[1110 + k * 60, 880], [1140 + k * 60, 930]], 4, 'rgba(240,200,90,.6)');
  // torch arm
  T.line([[1370, 840], [1420, 860], [1440, 790]], 34); T.line([[1370, 840], [1420, 860], [1440, 790]], 20, SKIN);
  ink(c => { c.moveTo(1420, 700); c.lineTo(1460, 700); c.lineTo(1450, 960); c.lineTo(1430, 960); c.closePath(); }, '#7a4a26', 5);
  ink(rr(1410, 670, 60, 40, 8), '#5a3a22', 4);
  ink(c => { c.moveTo(1400, 680); c.quadraticCurveTo(1380, 600, 1420, 560); c.quadraticCurveTo(1430, 610, 1440, 600); c.quadraticCurveTo(1450, 540, 1480, 520); c.quadraticCurveTo(1500, 610, 1480, 680); c.closePath(); }, '#ff8a2a', 4);
  fill(c => { c.moveTo(1416, 676); c.quadraticCurveTo(1410, 630, 1436, 610); c.quadraticCurveTo(1446, 640, 1456, 630); c.quadraticCurveTo(1470, 600, 1470, 676); c.closePath(); }, '#ffe066');
  g.fillStyle = rg(1440, 620, 0, 160, [[0, 'rgba(255,200,90,.45)'], [1, 'rgba(255,200,90,0)']]); g.fillRect(1280, 460, 320, 320);
  ink(ell(1440, 790, 28, 26), SKIN, 5);
  T.head(hx, hy, r);
  // beard + moustache
  ink(c => { c.moveTo(hx - 96, hy + 30); c.quadraticCurveTo(hx - 80, hy + 170, hx, hy + 176); c.quadraticCurveTo(hx + 80, hy + 170, hx + 96, hy + 30); c.quadraticCurveTo(hx, hy + 110, hx - 96, hy + 30); c.closePath(); }, '#3a2618', 5);
  face(hx, hy, r, 1, 'flat');
  ink(c => { c.moveTo(hx + 20, hy + 70); c.quadraticCurveTo(hx - 20, hy + 60, hx - 40, hy + 86); c.quadraticCurveTo(hx, hy + 84, hx + 20, hy + 80); c.quadraticCurveTo(hx + 40, hy + 84, hx + 80, hy + 86); c.quadraticCurveTo(hx + 60, hy + 60, hx + 20, hy + 70); c.closePath(); }, '#3a2618', 3);
  earSpool(hx - 100, hy + 40, 22);
  ink(rr(hx - 110, hy - 92, 220, 40, 12), GOLD, 5);
  for (let k = 0; k < 5; k++) ink(rr(hx - 90 + k * 40, hy - 84, 24, 24, 3), GOLDL, 2);
}
function leaderHand() {
  // hand gripping the rock
  T.line([[700, 760], [690, 830], [720, 850]], 40); T.line([[700, 760], [690, 830], [720, 850]], 26, SKIN);
  ink(rr(668, 700, 64, 40, 12), GOLD, 4);
  ink(c => { c.moveTo(680, 840); c.quadraticCurveTo(740, 820, 820, 850); c.lineTo(820, 880); c.quadraticCurveTo(740, 870, 680, 880); c.closePath(); }, SKIN, 5);
  [700, 730, 760, 790].forEach(x => T.line([[x, 850], [x + 4, 880]], 3));
}
function leader() {
  const hx = 870, hy = 400, r = 135;
  // feather fan behind the head
  const fan = [[-2.7, RED], [-2.45, TEAL], [-2.2, RED], [-1.95, TEAL], [-1.7, RED], [-1.45, TEAL], [-1.2, RED], [-.95, TEAL], [-.7, RED], [-.45, TEAL]];
  fan.forEach(([a, col]) => { g.save(); g.translate(hx, hy - 90); g.rotate(a + Math.PI / 2); ink(c => { c.moveTo(0, 0); c.quadraticCurveTo(-46, -150, 0, -290); c.quadraticCurveTo(46, -150, 0, 0); c.closePath(); }, col, 5); T.line([[0, -10], [0, -270]], 3, 'rgba(40,20,20,.5)'); fill(c => { c.moveTo(0, -200); c.quadraticCurveTo(-20, -250, 0, -286); c.quadraticCurveTo(20, -250, 0, -200); c.closePath(); }, col === RED ? '#f2a43a' : '#7fd8c8'); g.restore(); });
  // backpack bundle
  ink(ell(640, 520, 90, 80), '#9a6a3a', 6); T.P(c => c.arc(640, 520, 40, 0, Math.PI * 1.6)); g.lineWidth = 5; g.strokeStyle = '#5a3a22'; g.stroke();
  // torso leaning forward over the rock: cream tunic, red cape, gold collar
  ink(c => { c.moveTo(700, 900); c.quadraticCurveTo(700, 640, 840, 580); c.quadraticCurveTo(980, 560, 1000, 700); c.lineTo(980, 900); c.closePath(); }, CREAM, 7);
  ink(c => { c.moveTo(520, 620); c.quadraticCurveTo(700, 520, 900, 540); c.quadraticCurveTo(1060, 560, 1080, 640); c.quadraticCurveTo(900, 640, 760, 720); c.quadraticCurveTo(620, 760, 520, 620); c.closePath(); }, RED, 7);
  for (let k = 0; k < 6; k++) T.line([[600 + k * 70, 650 - k * 6], [640 + k * 70, 690 - k * 10]], 5, 'rgba(240,190,80,.55)');
  ink(c => { c.moveTo(760, 560); c.quadraticCurveTo(860, 650, 960, 560); c.quadraticCurveTo(860, 600, 760, 560); c.closePath(); }, GOLD, 5);
  ink(rr(830, 620, 70, 70, 10), GOLD, 5); ink(rr(846, 636, 38, 38, 4), GOLDL, 3); fill(rr(858, 648, 14, 14, 2), '#7a5216');
  // head
  [[-120, 40], [-130, 110], [120, 60]].forEach(([dx, dy]) => ink(ell(hx + dx, hy + dy, 40, 36), '#2a1e1a', 5));
  T.head(hx, hy, r);
  earSpool(hx - 130, hy + 50, 34);
