<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* Thumbnail: "The ENTIRE History of ROME" — the city that should have died five times.
 * A battered legionary with five arrows in his shield (one per near-death) gives a shaky
 * thumbs-up in the cow-field Forum, while a cow grazes beside a toppled column. */
const W = 1920, H = 1080, c = document.getElementById('c'), g = c.getContext('2d');
const INK = '#1f1712';
const P = (f) => { g.beginPath(); f(g); };
function ink(path, fill, lw = 7) {
  g.lineJoin = 'round'; g.lineCap = 'round';
  P(path); g.lineWidth = lw * 2; g.strokeStyle = INK; g.stroke();
  if (fill) { P(path); g.fillStyle = fill; g.fill(); }
}
function line(pts, w = 6, col = INK) {
  g.beginPath(); g.moveTo(...pts[0]);
  if (pts.length === 3) g.quadraticCurveTo(...pts[1], ...pts[2]); else pts.slice(1).forEach(p => g.lineTo(...p));
  g.lineWidth = w; g.strokeStyle = col; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke();
}
const ell = (x, y, rx, ry, r = 0) => c => c.ellipse(x, y, rx, ry, r, 0, Math.PI * 2);
const rr = (x, y, w, h, r) => c => c.roundRect(x, y, w, h, r);
const lg = (x0, y0, x1, y1, stops) => { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => gr.addColorStop(o, col)); return gr; };
const rg = (x, y, r0, r1, stops) => { const gr = g.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, col]) => gr.addColorStop(o, col)); return gr; };
// deterministic randomness so every render is identical
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------------- background ----------------
function sky() {
  g.fillStyle = lg(0, 0, 0, 720, [[0, '#ee8f3a'], [.55, '#f7c470'], [1, '#fbe2a6']]); g.fillRect(0, 0, W, H);
  // sun behind the soldier + rays
  g.fillStyle = rg(1430, 250, 0, 900, [[0, 'rgba(255,250,225,1)'], [.12, 'rgba(255,240,190,.95)'], [.35, 'rgba(255,214,130,.35)'], [1, 'rgba(255,200,120,0)']]); g.fillRect(0, 0, W, H);
  g.save(); g.globalCompositeOperation = 'screen';
  for (let i = 0; i < 18; i++) {
    const a = i / 18 * Math.PI * 2 + .1, a2 = a + .07;
    g.beginPath(); g.moveTo(1430, 250); g.lineTo(1430 + Math.cos(a) * 1800, 250 + Math.sin(a) * 1800); g.lineTo(1430 + Math.cos(a2) * 1800, 250 + Math.sin(a2) * 1800); g.closePath();
    g.fillStyle = 'rgba(255,240,200,.10)'; g.fill();
  }

  g.fillStyle = 'rgba(255,236,200,.45)';
  [[300, 170, 220, 40], [520, 130, 160, 32], [1750, 120, 200, 36], [980, 90, 180, 28]].forEach(([x, y, rx, ry]) => { P(ell(x, y, rx, ry)); g.fill(); P(ell(x + rx * .4, y - ry * .7, rx * .5, ry * .9)); g.fill(); });
}
function distance() {
  // hills
  g.fillStyle = '#d99a5c';
  g.beginPath(); g.moveTo(0, 640); g.bezierCurveTo(300, 560, 520, 600, 760, 590); g.bezierCurveTo(1000, 580, 1200, 540, 1500, 600); g.bezierCurveTo(1700, 630, 1820, 590, W, 600); g.lineTo(W, 760); g.lineTo(0, 760); g.fill();

  g.fillStyle = haze; g.fill(); g.clip();
  g.fillStyle = dark;
  for (let row = 0; row < 3; row++) for (let i = 0; i < 12; i++) {
    const x = cx - cw / 2 + 18 + i * 42, y = base - 40 - row * 68;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - 34); g.arc(x + 13, y - 34, 13, Math.PI, 0); g.lineTo(x + 26, y); g.fill();

  g.fillStyle = '#c4834f';
  g.fillRect(1020, 600, 300, 16);
  for (let i = 0; i < 6; i++) { const x = 1020 + i * 52; g.fillRect(x, 616, 12, 80); }
  g.fillStyle = '#d99a5c'; g.beginPath(); g.moveTo(1240, 590); g.lineTo(1330, 590); g.lineTo(1330, 700); g.lineTo(1300, 700); g.lineTo(1290, 640); g.lineTo(1262, 620); g.fill();
}
function forumColumns() {
  // three standing columns with an entablature fragment (Temple of Castor & Pollux)
  const base = 760, top = 330, col = '#e7c99a', shade = '#c79e6e';
  const xs = [820, 930, 1040];
  xs.forEach(x => {
    ink(rr(x - 30, top, 60, base - top, 4), col, 5);
    g.fillStyle = shade; g.fillRect(x + 8, top + 6, 18, base - top - 12);

function ground() {
  g.fillStyle = lg(0, 720, 0, H, [[0, '#a8913f'], [.35, '#86702e'], [1, '#553d1f']]);
  g.beginPath(); g.moveTo(0, 740); g.bezierCurveTo(500, 715, 1200, 745, W, 725); g.lineTo(W, H); g.lineTo(0, H); g.fill();

  // grass tufts
  for (let i = 0; i < 70; i++) {
    const x = rnd() * W, y = 750 + rnd() * 320, s = .6 + (y - 750) / 320 * 1.1;
    const col = rnd() > .5 ? '#6f8a35' : '#879f3f';
    for (let k = -2; k <= 2; k++) line([[x, y], [x + k * 7 * s + (rnd() - .5) * 6, y - (16 + rnd() * 14) * s]], 3 * s, col);

}
function fallenColumn() {

    g.strokeStyle = 'rgba(130,95,55,.55)'; g.lineWidth = 3;
    for (let k = 0; k < 14; k++) { const a = k / 14 * Math.PI * 2; g.beginPath(); g.arc(x + Math.cos(a) * rx * .82, y + Math.sin(a) * ry * .82, 5, 0, Math.PI * 2); g.stroke(); }
    g.fillStyle = 'rgba(130,95,55,.25)'; P(ell(x, y, rx * .45, ry * .45)); g.fill();
  };
  const drum = (x, y, w, h, rot) => {
    g.save(); g.translate(x, y); g.rotate(rot);
    ink(rr(-w / 2, -h / 2, w, h, 10), '#ecdcb8', 6);
    g.fillStyle = '#c9ab7c'; g.fillRect(-w / 2 + 6, h * .18, w - 12, h * .3);
    for (let k = -3; k <= 3; k++) line([[-w / 2 + 8, k * h / 8], [w / 2 - 8, k * h / 8]], 2.5, 'rgba(120,85,50,.5)');

  g.save(); g.translate(560, 1010); g.rotate(-.12);

  ink(ell(-46, -40, 26, 26), '#efe0bf', 5); ink(ell(46, -40, 26, 26), '#efe0bf', 5);

}

  g.save(); P(rr(-180, -80, 330, 150, 70)); g.clip();
  g.fillStyle = spot; P(ell(-90, -40, 60, 45, .3)); g.fill(); P(ell(60, 20, 50, 40, -.2)); g.fill(); P(ell(-150, 40, 40, 35)); g.fill();
  g.restore();
  // near legs
  ink(rr(-150, 40, 34, 120, 12), white, 6); ink(rr(100, 40, 34, 120, 12), white, 6);
  ink(rr(-152, 150, 38, 18, 6), spot, 5); ink(rr(98, 150, 38, 18, 6), spot, 5);
  // udder
  ink(ell(-20, 75, 34, 20), '#f2a9a9', 5);
  // neck + head, down to the grass
  ink(c => { c.moveTo(110, -60); c.quadraticCurveTo(200, -40, 225, 60); c.lineTo(175, 80); c.quadraticCurveTo(150, 10, 100, 20); c.closePath(); }, white, 7);
  ink(rr(170, 40, 90, 110, 40), white, 7);
  ink(rr(178, 112, 80, 52, 24), '#f4b7b0', 6);
  g.fillStyle = INK; P(ell(205, 140, 6, 8)); g.fill(); P(ell(235, 140, 6, 8)); g.fill();

  line([[188, 82], [200, 88], [212, 82]], 5);
  ink(ell(160, 60, 30, 14, .5), white, 6);
  ink(c => { c.moveTo(232, 48); c.quadraticCurveTo(268, 30, 270, 0); c.quadraticCurveTo(258, 30, 222, 40); c.closePath(); }, '#efe0b8', 5);
  // weeds in its mouth
  line([[218, 166], [205, 195]], 4, '#5e7a2e'); line([[226, 166], [232, 198]], 4, '#5e7a2e');
  g.restore();
}

// ---------------- the legionary ----------------

  line([[x0, y0], [x1, y1]], 14); line([[x0, y0], [x1, y1]], 7, '#9b6a3a');
  // fletching
  g.save(); g.translate(x1, y1); g.rotate(ang);
  ink(c => { c.moveTo(-40, 0); c.lineTo(10, -22); c.lineTo(18, -22); c.lineTo(-10, 0); c.closePath(); }, '#f2efe6', 4);
  ink(c => { c.moveTo(-40, 0); c.lineTo(10, 22); c.lineTo(18, 22); c.lineTo(-10, 0); c.closePath(); }, '#f2efe6', 4);
  g.restore();
  // splinters where it went in
  [[-14, -10], [12, -14], [-6, 16]].forEach(([dx, dy]) => line([[x0, y0], [x0 + dx, y0 + dy]], 3.5));
}

  g.save(); P(c => { c.moveTo(1370, 560); c.quadraticCurveTo(1475, 530, 1585, 560); c.lineTo(1592, 735); c.quadraticCurveTo(1478, 755, 1362, 735); c.closePath(); }); g.clip();
  g.fillStyle = 'rgba(140,90,30,.45)'; g.fillRect(1530, 540, 70, 220);
  for (let i = 0; i < 4; i++) line([[1360, 640 + i * 28], [1600, 640 + i * 28]], 5, 'rgba(60,35,15,.8)');
  g.fillStyle = 'rgba(255,245,200,.6)'; P(ell(1430, 595, 40, 14, -.15)); g.fill();
  // dent + scratches

  g.restore();

  ink(ell(1588, 585, 42, 34, -.4), '#d9a441', 6);
  // broken blade, jagged where it snapped
  ink(c => { c.moveTo(1690, 372); c.lineTo(1694, 215); c.lineTo(1706, 190); c.lineTo(1716, 214); c.lineTo(1728, 180); c.lineTo(1738, 206); c.lineTo(1742, 372); c.closePath(); }, '#d7dde3', 6);
  g.fillStyle = 'rgba(120,135,150,.5)'; P(c => { c.moveTo(1718, 370); c.lineTo(1718, 205); c.lineTo(1728, 185); c.lineTo(1738, 206); c.lineTo(1740, 370); c.closePath(); }); g.fill();
  line([[1716, 360], [1716, 230]], 3, 'rgba(60,70,80,.6)');

  // ---- head ----
  ink(c => { c.moveTo(hx - 175, hy - 10); c.bezierCurveTo(hx - 180, hy - 200, hx + 180, hy - 200, hx + 178, hy - 10); c.bezierCurveTo(hx + 176, hy + 150, hx + 90, hy + 185, hx, hy + 185); c.bezierCurveTo(hx - 95, hy + 185, hx - 172, hy + 150, hx - 175, hy - 10); c.closePath(); }, '#fbf7ef', 8);
  g.fillStyle = 'rgba(200,190,175,.45)'; P(c => { c.moveTo(hx + 120, hy - 60); c.bezierCurveTo(hx + 190, hy + 30, hx + 150, hy + 170, hx + 30, hy + 182); c.bezierCurveTo(hx + 120, hy + 140, hx + 160, hy + 40, hx + 120, hy - 60); }); g.fill();

  g.save(); P(c => { c.moveTo(hx - 80, hy + 100); c.quadraticCurveTo(hx + 5, hy + 120, hx + 95, hy + 92); c.quadraticCurveTo(hx + 80, hy + 168, hx + 5, hy + 168); c.quadraticCurveTo(hx - 70, hy + 165, hx - 80, hy + 100); c.closePath(); }); g.clip();
  g.fillStyle = '#ffffff'; g.fillRect(hx - 90, hy + 90, 190, 34);

  g.fillStyle = '#e8726a'; P(ell(hx + 5, hy + 168, 50, 22)); g.fill();
  g.restore();
  // band-aid cross on cheek
  g.save(); g.translate(hx + 128, hy + 108);
  [.7, -.7].forEach(r => { g.save(); g.rotate(r); ink(rr(-34, -11, 68, 22, 9), '#f2c49a', 4); g.restore(); });
  g.restore();
  // sweat drops
  const drop = (x, y, s) => ink(c => { c.moveTo(x, y - 30 * s); c.bezierCurveTo(x + 20 * s, y, x + 16 * s, y + 18 * s, x, y + 18 * s); c.bezierCurveTo(x - 16 * s, y + 18 * s, x - 20 * s, y, x, y - 30 * s); c.closePath(); }, '#7fd0ff', 4);

function title(text, x, y, size, fill, rot, skew = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.transform(1, 0, skew, 1, 0, 0);
  g.font = `${size}px Lucky`; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
  // hard drop shadow
  g.fillStyle = INK; g.strokeStyle = INK; g.lineWidth = size * .24;
  g.strokeText(text, 10, 16); g.fillText(text, 10, 16);
  g.lineWidth = size * .2; g.strokeText(text, 0, 0);
  g.fillStyle = fill; g.fillText(text, 0, 0);
  // inner highlight band on the top half
  g.save(); g.beginPath(); g.rect(-20, -size, 3000, size * .42); g.clip();
  g.fillStyle = 'rgba(255,255,255,.35)'; g.fillText(text, 0, 0); g.restore();
  g.restore();
}

function grade() {
  // warm glow + vignette, then fine paper grain
  g.fillStyle = rg(W / 2, H / 2, 300, 1200, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(60,25,5,.55)']]); g.fillRect(0, 0, W, H);
  const img = g.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - .5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(img, 0, 0);
}
