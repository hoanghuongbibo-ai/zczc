<!doctype html><meta charset="utf-8">
<style>@font-face { font-family: Lucky; src: url(luckiest-guy-latin-400-normal.woff2); } body { margin: 0; background: #111; }</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../lib/toon.js"></script>
<script>
/* Variant C — "peel back the city": Venice seen from above, terracotta roofs and the Grand Canal,
 * with the bottom-right corner peeled up like a sticker. Underneath: thousands of log ends with
 * tree rings. A gondolier stands in the hole, holding the flap up, horrified. */
const T = Toon(document.getElementById('c'), 13), { g, W, H, INK, ink, line, ell, rr, lg, rg, fill } = T;
// fold line from A (bottom edge) to B (right edge); the corner C is lifted to C2
const A = [930, 1080], B = [1920, 330], C = [1920, 1080];
const d = [B[0] - A[0], B[1] - A[1]], t = ((C[0] - A[0]) * d[0] + (C[1] - A[1]) * d[1]) / (d[0] * d[0] + d[1] * d[1]);
const F = [A[0] + d[0] * t, A[1] + d[1] * t];
const C2 = [C[0] + (F[0] - C[0]) * 1.45, C[1] + (F[1] - C[1]) * 1.45];   // partly lifted, not flat

function roofs() {
  g.fillStyle = '#e9d6b4'; g.fillRect(0, 0, W, H);   // alleys / campi in between
  const cols = ['#c8583a', '#d9733f', '#e8904f', '#b84a32', '#de7f45', '#efad6c', '#c96a4a'];
  const roof = (x, y, w, h, rot, col) => {
    g.save(); g.translate(x + w / 2, y + h / 2); g.rotate(rot);
    ink(rr(-w / 2, -h / 2, w, h, 4), col, 4);
    // hipped roof: ridge plus four hips, the lower half in shade
    const rx = Math.max(6, w / 2 - h / 2);
    fill(c => { c.moveTo(-w / 2 + 3, h / 2 - 3); c.lineTo(-rx, 0); c.lineTo(rx, 0); c.lineTo(w / 2 - 3, h / 2 - 3); c.closePath(); }, 'rgba(60,15,5,.28)');
    fill(c => { c.moveTo(w / 2 - 3, -h / 2 + 3); c.lineTo(rx, 0); c.lineTo(w / 2 - 3, h / 2 - 3); c.closePath(); }, 'rgba(60,15,5,.16)');
    T.line([[-rx, 0], [rx, 0]], 3, 'rgba(70,20,8,.7)');
    [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([sx, sy]) => T.line([[sx * rx, 0], [sx * (w / 2 - 3), sy * (h / 2 - 3)]], 2, 'rgba(70,20,8,.5)'));
    if (T.rnd() > .55) ink(rr(-w * .25, -h / 2 + 8, 14, 14, 3), '#8a4a30', 3);
    g.restore();
  };
  g.save(); g.translate(W / 2, H / 2); g.rotate(-.16); g.translate(-W / 2, -H / 2);   // tilt the street grid so it doesn't read as brickwork
  for (let y = -260; y < H + 260;) {
    const rowH = 70 + T.rnd() * 70; let x = -260 - T.rnd() * 60;
    while (x < W + 260) {
      const w = 70 + T.rnd() * 170, h = rowH - 8 - T.rnd() * 16;
      if (T.rnd() > .93) { fill(rr(x, y, w, h, 6), '#d9c9a3'); fill(ell(x + w / 2, y + h / 2, 10, 10), '#b9a581'); }   // a campo with its well
      else roof(x, y, w, h, (T.rnd() - .5) * .08, cols[Math.floor(T.rnd() * cols.length)]);
      x += w + 8 + T.rnd() * 18;
    }
    y += rowH + 6 + T.rnd() * 10;
  }
  g.restore();
  // small canals
  [[[0, 520], [500, 470], [900, 560]], [[1200, 0], [1150, 300], [1300, 560]], [[300, 0], [380, 200], [260, 420]]].forEach(p => { T.line(p, 40); T.line(p, 28, '#2f9aa0'); });
  // Grand Canal: the big reverse S
  const gc = c => { c.moveTo(-50, 900); c.bezierCurveTo(400, 820, 500, 520, 850, 470); c.bezierCurveTo(1200, 420, 1300, 140, 1980, 120); };
  g.lineCap = 'round';
  T.P(gc); g.lineWidth = 170; g.strokeStyle = INK; g.stroke();
  T.P(gc); g.lineWidth = 150; g.strokeStyle = '#2aa0a6'; g.stroke();
  T.P(gc); g.lineWidth = 40; g.strokeStyle = 'rgba(255,255,255,.14)'; g.stroke();
  // gondolas + a vaporetto
  [[330, 820, -.3], [700, 520, -.35], [1420, 220, -.15], [1100, 400, -.6]].forEach(([x, y, r]) => { g.save(); g.translate(x, y); g.rotate(r); ink(ell(0, 0, 60, 11), '#1f1915', 3); T.line([[-70, 4], [-110, 0]], 3, 'rgba(255,255,255,.6)'); g.restore(); });
  g.save(); g.translate(960, 450); g.rotate(-.25); ink(rr(-70, -22, 140, 44, 16), '#f2f0e6', 4); ink(rr(-40, -14, 70, 28, 8), '#d9c25a', 3); g.restore();
  // Rialto Bridge
  g.save(); g.translate(560, 620); g.rotate(-.9); ink(rr(-30, -110, 60, 220, 10), '#f1e6cc', 5); for (let k = -3; k <= 3; k++) T.line([[-24, k * 28], [24, k * 28]], 2.5, 'rgba(120,85,50,.5)'); g.restore();
}
function logEnds() {
  // the hole: dark mud packed with log ends, each with tree rings
  g.save(); T.P(c => { c.moveTo(...A); c.lineTo(...B); c.lineTo(...C); c.closePath(); }); g.clip();
  g.fillStyle = '#3a2716'; g.fillRect(A[0], B[1], W - A[0], H - B[1]);
  const r = 40;
  for (let row = 0, y = B[1] - r; y < H + r; row++, y += r * 1.72) for (let x = A[0] - r + (row % 2) * r; x < W + r; x += r * 2.02) {
    const rr0 = r * (.88 + T.rnd() * .14), cx = x + (T.rnd() - .5) * 5, cy = y + (T.rnd() - .5) * 5;
    ink(ell(cx, cy, rr0, rr0), '#7a5230', 4);
    fill(ell(cx, cy, rr0 * .86, rr0 * .86), '#f0c487'); fill(ell(cx - rr0 * .25, cy - rr0 * .25, rr0 * .4, rr0 * .3), 'rgba(255,240,200,.35)');
    g.strokeStyle = 'rgba(140,90,45,.75)'; g.lineWidth = 2.2;
    for (let k = .2; k < .85; k += .16) { g.beginPath(); g.ellipse(cx + 1, cy + 1, rr0 * k, rr0 * k * .94, 0, 0, Math.PI * 2); g.stroke(); }
    fill(ell(cx + 1, cy + 1, 3, 3), '#7a5230');
    if (T.rnd() > .6) T.line([[cx, cy], [cx + rr0 * .8, cy - rr0 * .3]], 2.5, 'rgba(90,55,25,.8)');   // radial crack
  }
  // shadow cast by the lifted flap
  g.fillStyle = lg(F[0], F[1], C[0], C[1], [[0, 'rgba(0,0,0,.5)'], [.25, 'rgba(0,0,0,0)']]); g.fillRect(A[0], B[1], W - A[0], H - B[1]);
  g.restore();
  T.line([A, B], 10);
}
function flap() {
  const n = [(C2[0] - F[0]), (C2[1] - F[1])], L = Math.hypot(...n), u = [n[0] / L, n[1] / L];
  const path = c => { c.moveTo(...A); c.quadraticCurveTo(C2[0] - 60, C2[1] + 200, ...C2); c.quadraticCurveTo(C2[0] + 160, C2[1] - 20, ...B); c.closePath(); };
  g.save(); g.filter = 'blur(20px)'; g.translate(-40, 30); T.P(path); g.fillStyle = 'rgba(0,0,0,.5)'; g.fill(); g.restore();
  ink(path, lg(F[0], F[1], C2[0], C2[1], [[0, '#5b3f26'], [.55, '#8f6a42'], [.85, '#c8a372'], [1, '#e9cf9e']]), 7);
  g.save(); T.P(path); g.clip();
  for (let i = 0; i < 70; i++) { const k = T.rnd(), m = T.rnd(); const x = A[0] + (B[0] - A[0]) * k + (C2[0] - F[0]) * m, y = A[1] + (B[1] - A[1]) * k + (C2[1] - F[1]) * m; fill(ell(x, y, 5 + T.rnd() * 12, 3 + T.rnd() * 6, T.rnd() * 3), 'rgba(40,25,12,.4)'); }
  // snapped pile stubs still stuck to the underside
  for (let i = 0; i < 16; i++) { const k = .06 + i / 17, m = .25 + T.rnd() * .55; const x = A[0] + (B[0] - A[0]) * k + n[0] * m, y = A[1] + (B[1] - A[1]) * k + n[1] * m; ink(ell(x, y, 15, 15), '#e3b47a', 3); fill(ell(x, y, 5, 5), 'rgba(120,80,40,.7)'); }
  g.restore();
  // the cut edge along the fold: stone, then mud, then the tops of the piles
  const band = (o0, o1, col) => ink(c => { c.moveTo(A[0] + u[0] * o0, A[1] + u[1] * o0); c.lineTo(B[0] + u[0] * o0, B[1] + u[1] * o0); c.lineTo(B[0] + u[0] * o1, B[1] + u[1] * o1); c.lineTo(A[0] + u[0] * o1, A[1] + u[1] * o1); c.closePath(); }, col, 4);
  band(0, 22, '#cfc6b4'); band(22, 46, '#6e4a2a');
  for (let k = .02; k < 1; k += .03) { const x = A[0] + (B[0] - A[0]) * k + u[0] * 34, y = A[1] + (B[1] - A[1]) * k + u[1] * 34; fill(ell(x, y, 7, 7), '#e3b47a'); }
}
function gondolier() {
  const hx = 1610, hy = 760;
  // body (cropped by the bottom edge), standing on the logs
  const torso = c => { c.moveTo(1500, 900); c.quadraticCurveTo(1610, 870, 1720, 900); c.lineTo(1740, 1100); c.lineTo(1480, 1100); c.closePath(); };
  T.stripes(torso, 1470, 870, 280, 240, 32);
  // arm up, palm pushing the flap
  T.line([[1700, 920], [1810, 760], [1770, 500]], 34); T.line([[1700, 920], [1810, 760], [1770, 500]], 20, '#fbf7ef');
  [[1724, 468], [1744, 458], [1766, 454], [1788, 460]].forEach(([x, y]) => ink(rr(x - 8, y - 26, 16, 34, 8), '#fbf7ef', 4));
  ink(ell(1760, 490, 38, 30, -.3), '#fbf7ef', 5);
  // other hand on cheek in horror
  T.line([[1520, 920], [1440, 880], [1460, 800]], 34); T.line([[1520, 920], [1440, 880], [1460, 800]], 20, '#fbf7ef');
  T.head(hx, hy, 140);
  ink(ell(1462, 790, 32, 30), '#fbf7ef', 5);
  T.eye(hx - 48, hy + 20, 38, 48, -18, 10, .3); T.eye(hx + 50, hy + 20, 38, 48, -16, 10, .3);
  T.line([[hx - 95, hy - 32], [hx - 25, hy - 56]], 11); T.line([[hx + 25, hy - 56], [hx + 95, hy - 32]], 11);
  ink(c => { c.moveTo(hx - 40, hy + 110); c.quadraticCurveTo(hx, hy + 80, hx + 40, hy + 110); c.quadraticCurveTo(hx + 40, hy + 170, hx, hy + 170); c.quadraticCurveTo(hx - 40, hy + 170, hx - 40, hy + 110); c.closePath(); }, '#7a2420', 6);
  fill(ell(hx, hy + 152, 22, 12), '#e8726a');
  T.boater(hx + 10, hy - 140, .95, .12);
  T.drop(hx - 170, hy - 20, .9); T.drop(hx + 170, hy + 30, .8);
}

document.fonts.load('100px Lucky').then(() => {
  roofs(); logEnds(); flap(); gondolier();
  T.grade('rgba(30,15,5,.6)');
  T.title("WHAT'S REALLY", 60, 180, 138, '#ffffff', -.04);
  T.title('UNDER VENICE?', 46, 380, 190, T.yellow(190), -.04);
  T.badge('PEEK UNDERNEATH', 400, 960, 56, -.05);
  window.DONE = true;
});
</script>
