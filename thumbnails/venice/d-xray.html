<!doctype html><meta charset="utf-8">
<style>@font-face { font-family: Lucky; src: url(luckiest-guy-latin-400-normal.woff2); } body { margin: 0; background: #111; }</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../lib/toon.js"></script>
<script>
/* Variant D — "X-ray lens": a sunny Grand Canal of colourful palazzi. A gondolier holds up a
 * magnifying glass, and inside the lens everything is an X-ray: the palaces stand on a forest
 * of glowing timber piles driven into the mud (plus one fish skeleton). */
const T = Toon(document.getElementById('c'), 21), { g, W, H, INK, ink, line, ell, rr, lg, rg, fill } = T;
const WL = 640, LX = 760, LY = 740, LR = 290;

// palazzi along the canal; shared by the normal view and the X-ray view
const PAL = [];
{ let x = -30; const cols = ['#f2a7a0', '#f4c867', '#e0784e', '#f6e2bf', '#9fd1b8', '#e99a6e', '#f5b8c6', '#d8c27a'];
  while (x < W + 40) { const w = 150 + T.rnd() * 110, h = 230 + T.rnd() * 170; PAL.push({ x, w, h, col: cols[PAL.length % cols.length], floors: 2 + Math.floor(h / 120) }); x += w; } }

function sky() {
  g.fillStyle = lg(0, 0, 0, WL, [[0, '#5fb8ea'], [.7, '#a9def5'], [1, '#e4f6fb']]); g.fillRect(0, 0, W, WL);
  g.fillStyle = 'rgba(255,255,255,.9)';
  [[1450, 120, 1], [1800, 210, .7], [380, 470, .8], [1130, 60, .6]].forEach(([x, y, s]) => { [[0, 0, 110, 40], [-70, 10, 70, 32], [70, 12, 80, 30], [10, -30, 70, 40]].forEach(([dx, dy, rx, ry]) => { T.P(ell(x + dx * s, y + dy * s, rx * s, ry * s)); g.fill(); }); });
}
function palazzi(xray) {
  const OUT = xray ? '#8ff3ff' : INK, lw = xray ? 2.5 : 5;
  const box = (path, col) => xray ? (T.P(path), g.lineWidth = lw * 2, g.strokeStyle = OUT, g.stroke()) : ink(path, col, lw);
  for (const p of PAL) {
    const top = WL - p.h;
    box(rr(p.x, top, p.w, p.h + 10, 2), p.col);
    if (!xray) { g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(p.x + p.w - 22, top + 4, 18, p.h); fill(rr(p.x - 4, top - 14, p.w + 8, 18, 3), '#f6ecd6'); T.line([[p.x - 4, top - 14], [p.x + p.w + 4, top - 14]], 4); }
    // gothic windows, a balcony on the piano nobile, water door at the bottom
    const fh = (p.h - 70) / p.floors;
    for (let f = 0; f < p.floors; f++) {
      const y = top + 30 + f * fh, n = Math.max(2, Math.floor(p.w / 46)), ww = 22;
      for (let i = 0; i < n; i++) {
        const x = p.x + (p.w - (n - 1) * 40) / 2 + i * 40 - ww / 2;
        box(c => { c.moveTo(x, y + fh * .65); c.lineTo(x, y + 14); c.quadraticCurveTo(x + ww / 2, y - 8, x + ww, y + 14); c.lineTo(x + ww, y + fh * .65); c.closePath(); }, '#3a2a3a');
      }
      if (f === 1 && !xray) { ink(rr(p.x + 20, top + 30 + f * fh + fh * .62, p.w - 40, 12, 3), '#f6ecd6', 3); }
    }
    box(c => { const x = p.x + p.w / 2 - 26; c.moveTo(x, WL + 10); c.lineTo(x, WL - 50); c.arc(x + 26, WL - 50, 26, Math.PI, 0); c.lineTo(x + 52, WL + 10); c.closePath(); }, '#2b2030');
  }
  // striped mooring poles
  [260, 820, 1210, 1700].forEach((x, i) => {
    box(rr(x - 9, WL - 110, 18, 160, 7), '#fbf3e4');
    if (!xray) { g.fillStyle = i % 2 ? '#c6362a' : '#2f62b8'; for (let y = WL - 100; y < WL + 40; y += 26) g.fillRect(x - 8, y, 16, 13); }
  });
}
function water() {
  g.fillStyle = lg(0, WL, 0, H, [[0, '#3fb3b0'], [1, '#1d6f7a']]); g.fillRect(0, WL, W, H - WL);
  // soft coloured reflections of the palazzi
  for (const p of PAL) { g.fillStyle = p.col; g.globalAlpha = .28; for (let y = WL + 10; y < WL + p.h * .7; y += 16) g.fillRect(p.x + Math.sin(y * .1) * 6, y, p.w, 9); g.globalAlpha = 1; }
  for (let i = 0; i < 70; i++) { const x = T.rnd() * W, y = WL + 10 + T.rnd() * (H - WL); T.line([[x, y], [x + 30 + T.rnd() * 70, y]], 4, `rgba(255,255,255,${.2 + T.rnd() * .4})`); }
  T.line([[0, WL + 10], [W, WL + 10]], 6);
}
function xrayView() {
  g.save(); T.P(ell(LX, LY, LR, LR)); g.clip();
  g.fillStyle = lg(0, LY - LR, 0, LY + LR, [[0, '#0d2a52'], [1, '#061630']]); g.fillRect(LX - LR, LY - LR, LR * 2, LR * 2);
  g.strokeStyle = 'rgba(120,220,255,.15)'; g.lineWidth = 2;
  for (let x = LX - LR; x < LX + LR; x += 30) { g.beginPath(); g.moveTo(x, LY - LR); g.lineTo(x, LY + LR); g.stroke(); }
  for (let y = LY - LR; y < LY + LR; y += 30) { g.beginPath(); g.moveTo(LX - LR, y); g.lineTo(LX + LR, y); g.stroke(); }
  g.save(); g.globalAlpha = .9; palazzi(true); g.restore();
  // waterline + mud hatch
  T.line([[LX - LR, WL + 10], [LX + LR, WL + 10]], 4, '#8ff3ff');
  g.fillStyle = 'rgba(120,200,255,.12)'; g.fillRect(LX - LR, 880, LR * 2, LR);
  for (let x = LX - LR - 200; x < LX + LR; x += 26) T.line([[x, 1040], [x + 40, 890]], 2, 'rgba(140,220,255,.25)');
  // the piles: glowing, packed tight under every wall
  g.save(); g.shadowColor = '#7fe9ff'; g.shadowBlur = 12;
  for (let x = LX - LR + 6; x < LX + LR; x += 36) {
    const bot = 930 + T.rnd() * 70, w = 16;
    T.P(c => { c.moveTo(x - w / 2, WL + 16); c.lineTo(x + w / 2, WL + 16); c.lineTo(x + w / 2, bot - 12); c.lineTo(x, bot); c.lineTo(x - w / 2, bot - 12); c.closePath(); });
    g.fillStyle = 'rgba(225,252,255,.92)'; g.fill();
  }
  g.restore();
  // timber deck the walls sit on
  fill(rr(LX - LR, WL + 8, LR * 2, 14, 2), '#e8fdff');
  // fish skeleton swimming through
  g.save(); g.translate(LX - 110, 800); g.strokeStyle = '#ffffff'; g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-60, 0); g.lineTo(60, 0); for (let k = -40; k <= 40; k += 20) { g.moveTo(k, -22); g.lineTo(k + 6, 0); g.lineTo(k, 22); } g.stroke();
  g.beginPath(); g.moveTo(60, 0); g.lineTo(90, -22); g.lineTo(90, 22); g.closePath(); g.stroke();
  g.beginPath(); g.ellipse(-78, 0, 22, 20, 0, 0, Math.PI * 2); g.stroke(); fill(ell(-84, -4, 5, 5), '#fff');
  g.restore();
  // scanline sheen
  g.fillStyle = lg(LX - LR, LY - LR, LX + LR, LY + LR, [[0, 'rgba(255,255,255,.18)'], [.4, 'rgba(255,255,255,0)']]); g.fillRect(LX - LR, LY - LR, LR * 2, LR * 2);
  g.restore();
}
function lens() {
  // handle down toward the gondolier's hand
  const a = .62, hx0 = LX + Math.cos(a) * (LR + 20), hy0 = LY + Math.sin(a) * (LR + 20);
  g.save(); g.translate(hx0, hy0); g.rotate(a);
  ink(rr(0, -26, 80, 52, 10), '#c9922e', 6);
  ink(rr(70, -32, 260, 64, 30), '#6b3a1f', 7);
  T.line([[100, -14], [300, -14]], 5, 'rgba(255,220,180,.35)');
  g.restore();
  // brass rim
  T.P(ell(LX, LY, LR + 22, LR + 22)); g.lineWidth = 58; g.strokeStyle = INK; g.stroke();
  T.P(ell(LX, LY, LR + 22, LR + 22)); g.lineWidth = 40; g.strokeStyle = '#e1ad3e'; g.stroke();
  T.P(c => c.arc(LX, LY, LR + 22, Math.PI * 1.05, Math.PI * 1.55)); g.lineWidth = 12; g.strokeStyle = 'rgba(255,248,210,.8)'; g.stroke();
  T.P(c => c.arc(LX, LY, LR + 22, Math.PI * .1, Math.PI * .6)); g.lineWidth = 14; g.strokeStyle = 'rgba(120,70,10,.5)'; g.stroke();
  // glass glint
  T.P(c => c.arc(LX, LY, LR - 30, Math.PI * 1.15, Math.PI * 1.4)); g.lineWidth = 14; g.strokeStyle = 'rgba(255,255,255,.55)'; g.stroke();
}
function gondolier() {
  const hx = 1590, hy = 560;
  const torso = c => { c.moveTo(1450, 760); c.quadraticCurveTo(1590, 720, 1730, 760); c.lineTo(1770, 1100); c.lineTo(1420, 1100); c.closePath(); };
  T.stripes(torso, 1400, 730, 380, 380, 36);
  ink(rr(1420, 980, 350, 36, 12), '#c7322a', 5);
  // arm out to the lens handle
  const a = .62, gx = LX + Math.cos(a) * (LR + 300), gy = LY + Math.sin(a) * (LR + 300);
  T.line([[1470, 800], [1330, 900], [gx + 10, gy - 10]], 40); T.line([[1470, 800], [1330, 900], [gx + 10, gy - 10]], 24, '#fbf7ef');
  ink(ell(gx + 4, gy - 4, 40, 36), '#fbf7ef', 6);
  T.line([[gx - 20, gy - 20], [gx + 22, gy - 26]], 4); T.line([[gx - 18, gy], [gx + 26, gy - 4]], 4);
  // other hand on top of his head
  T.line([[1720, 790], [1820, 640], [1760, 460]], 36); T.line([[1720, 790], [1820, 640], [1760, 460]], 22, '#fbf7ef');
  T.head(hx, hy, 165);
  ink(ell(1755, 450, 36, 32), '#fbf7ef', 5);
  // shocked: one eye blown wide, one squinting to look closer
  T.eye(hx - 60, hy + 30, 50, 62, -28, 10, .3);
  T.line([[hx + 20, hy + 30], [hx + 100, hy + 20]], 10); T.line([[hx + 30, hy + 6], [hx + 95, hy - 4]], 7);
  T.line([[hx - 120, hy - 70], [hx - 30, hy - 82]], 11); T.line([[hx + 30, hy - 30], [hx + 110, hy - 44]], 11);
  ink(ell(hx - 10, hy + 135, 40, 48), '#7a2420', 7);
  fill(ell(hx - 10, hy + 160, 24, 14), '#e8726a');
  T.boater(hx + 30, hy - 160, 1.05, .2);
  T.drop(hx - 200, hy - 40, 1); T.drop(hx + 200, hy + 40, .8);
}

document.fonts.load('100px Lucky').then(() => {
  sky(); palazzi(false); water(); xrayView(); lens(); gondolier();
  T.grade('rgba(10,25,40,.5)');
  T.title("WHAT'S REALLY", 60, 175, 136, '#ffffff', -.04);
  T.title('UNDER VENICE?', 46, 370, 188, T.yellow(188), -.04);
  T.badge('X-RAY', 1120, 520, 64, .08);
  window.DONE = true;
});
</script>
