<!doctype html><meta charset="utf-8">
<style>
@font-face { font-family: Lucky; src: url(luckiest-guy-latin-400-normal.woff2); }
@font-face { font-family: Fredoka; font-weight: 700; src: url(fredoka-latin-700-normal.woff2); }
body { margin: 0; background: #111; }
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* Thumbnail: "What's Really Under Venice?" — a cutaway of the city. Above the waterline, the
 * golden skyline of St Mark's; below it, a buried forest of timber piles. A gondolier in a
 * diving mask shines a flashlight on them, shocked, while his straw hat floats away. */
const W = 1920, H = 1080, WL = 470, c = document.getElementById('c'), g = c.getContext('2d');
const INK = '#1b1410';
const P = (f) => { g.beginPath(); f(g); };
function ink(path, fill, lw = 7) {
  g.lineJoin = 'round'; g.lineCap = 'round';
  P(path); g.lineWidth = lw * 2; g.strokeStyle = INK; g.stroke();
  if (fill) { P(path); g.fillStyle = fill; g.fill(); }
}
function line(pts, w = 6, col = INK) {
  g.beginPath(); g.moveTo(...pts[0]);
  if (pts.length === 3) g.quadraticCurveTo(...pts[1], ...pts[2]); else pts.slice(1).forEach(p => g.lineTo(...p));
  g.lineWidth = w; g.strokeStyle = col; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke();
}
const ell = (x, y, rx, ry, r = 0) => c => c.ellipse(x, y, rx, ry, r, 0, Math.PI * 2);
const rr = (x, y, w, h, r) => c => c.roundRect(x, y, w, h, r);
const lg = (x0, y0, x1, y1, stops) => { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => gr.addColorStop(o, col)); return gr; };
const rg = (x, y, r0, r1, stops) => { const gr = g.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, col]) => gr.addColorStop(o, col)); return gr; };
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------------- above the water ----------------
function sky() {
  g.fillStyle = lg(0, 0, 0, WL, [[0, '#f08a3c'], [.6, '#f9c56e'], [1, '#fde3a6']]); g.fillRect(0, 0, W, WL);
  g.fillStyle = rg(1180, 330, 0, 700, [[0, 'rgba(255,250,225,1)'], [.15, 'rgba(255,238,185,.9)'], [.5, 'rgba(255,205,120,.3)'], [1, 'rgba(255,200,120,0)']]); g.fillRect(0, 0, W, WL);
  g.save(); g.globalCompositeOperation = 'screen';
  for (let i = 0; i < 16; i++) {
    const a = Math.PI + i / 15 * Math.PI, a2 = a + .06;
    g.beginPath(); g.moveTo(1180, 330); g.lineTo(1180 + Math.cos(a) * 1500, 330 + Math.sin(a) * 1500); g.lineTo(1180 + Math.cos(a2) * 1500, 330 + Math.sin(a2) * 1500); g.closePath();
    g.fillStyle = 'rgba(255,240,200,.10)'; g.fill();
  }
  g.restore();
  g.fillStyle = 'rgba(255,236,200,.5)';
  [[1450, 110, 200, 30], [1750, 170, 150, 24], [700, 80, 170, 26]].forEach(([x, y, rx, ry]) => { P(ell(x, y, rx, ry)); g.fill(); P(ell(x + rx * .35, y - ry * .7, rx * .5, ry * .9)); g.fill(); });
}
function skyline() {
  // distant hazy domes (Salute) on the left behind the title
  g.fillStyle = '#e3a76a';
  P(c => { c.moveTo(0, WL); c.lineTo(0, 400); c.lineTo(300, 400); c.lineTo(300, 340); c.quadraticCurveTo(360, 250, 420, 340); c.lineTo(420, 380); c.lineTo(520, 380); c.quadraticCurveTo(545, 330, 570, 380); c.lineTo(900, 395); c.lineTo(900, WL); c.closePath(); }); g.fill();
  // Doge's Palace: pink, arcaded
  const px = 1130, pw = 560, pt = 300;
  ink(rr(px, pt, pw, WL - pt, 2), '#f2b6a0', 6);
  g.fillStyle = 'rgba(200,110,90,.35)'; for (let y = pt + 14; y < pt + 90; y += 18) for (let x = px + (y / 18 % 2) * 14; x < px + pw; x += 28) g.fillRect(x + 4, y, 10, 6); // diaper pattern
  for (let i = 0; i < 6; i++) ink(rr(px + 24 + i * 90, pt + 34, 32, 54, 16), '#5a3528', 4);
  for (let i = 0; i < 17; i++) { const x = px + 10 + i * 32; ink(c => { c.moveTo(x, WL); c.lineTo(x, 412); c.arc(x + 12, 412, 12, Math.PI, 0); c.lineTo(x + 24, WL); }, '#4a2a20', 3); }
  g.fillStyle = '#fbe3c8'; g.fillRect(px, 395, pw, 8);
  for (let i = 0; i < 18; i++) ink(c => { const x = px + 6 + i * 31; c.moveTo(x, pt); c.lineTo(x + 12, pt - 16); c.lineTo(x + 24, pt); c.closePath(); }, '#fbe3c8', 3);
  // Basilica domes behind the palace, left
  [[1010, 285, 62], [1110, 250, 76], [920, 300, 50]].forEach(([x, y, r]) => {
    ink(c => { c.moveTo(x - r, y + 20); c.quadraticCurveTo(x - r, y - r, x, y - r * 1.05); c.quadraticCurveTo(x + r, y - r, x + r, y + 20); c.closePath(); }, '#9bb7a0', 5);
    line([[x, y - r * 1.05], [x, y - r * 1.5]], 5); ink(ell(x, y - r * 1.25, 8, 10), '#e2b647', 3);
    g.fillStyle = 'rgba(60,90,70,.35)'; P(c => { c.moveTo(x + r * .3, y - r * .9); c.quadraticCurveTo(x + r, y - r * .6, x + r, y + 20); c.lineTo(x + r * .4, y + 20); c.closePath(); }); g.fill();
  });
  ink(rr(870, 300, 280, WL - 300, 2), '#e9cfa6', 6);
  for (let i = 0; i < 5; i++) { const x = 882 + i * 54; ink(c => { c.moveTo(x, WL); c.lineTo(x, 360); c.arc(x + 20, 360, 20, Math.PI, 0); c.lineTo(x + 40, WL); }, '#c79a3e', 4); }
  // the four bronze horses — tiny gold dots above the door
  for (let i = 0; i < 4; i++) ink(ell(944 + i * 44, 330, 12, 9), '#d79b3a', 3);
  // Campanile: brick shaft, belfry, green pyramid, gold angel
  const cx = 1745, cw = 92, ct = 70;
  ink(c => { c.moveTo(cx - cw / 2, WL); c.lineTo(cx - cw / 2, ct + 130); c.lineTo(cx + cw / 2, ct + 130); c.lineTo(cx + cw / 2, WL); c.closePath(); }, '#c9583c', 6);
  for (let k = -1; k <= 1; k++) line([[cx + k * 24, ct + 140], [cx + k * 24, WL - 10]], 3, 'rgba(110,40,25,.5)');
  ink(rr(cx - cw / 2 - 8, ct + 70, cw + 16, 62, 4), '#efdcb5', 6);
  for (let i = 0; i < 4; i++) ink(rr(cx - 38 + i * 20, ct + 80, 12, 40, 6), '#5a3528', 3);
  ink(c => { c.moveTo(cx - cw / 2 - 4, ct + 72); c.lineTo(cx, ct - 40); c.lineTo(cx + cw / 2 + 4, ct + 72); c.closePath(); }, '#5f9a7a', 6);
  ink(ell(cx, ct - 52, 10, 14), '#f2c344', 4);
  // mooring poles with stripes
  [[1080, '#2f62b8'], [1105, '#2f62b8'], [1860, '#c6362a']].forEach(([x, col]) => {
    ink(rr(x - 8, 380, 16, 100, 6), '#fbf3e4', 4);
    g.fillStyle = col; for (let y = 390; y < 470; y += 24) g.fillRect(x - 7, y, 14, 12);
    ink(ell(x, 378, 10, 7), col, 3);
  });
  // warm haze so the title reads
  g.fillStyle = lg(0, 0, 900, 0, [[0, 'rgba(250,200,130,.35)'], [1, 'rgba(250,200,130,0)']]); g.fillRect(0, 0, 900, WL);
}
function gondola() {
  g.save(); g.translate(560, WL - 6);
  ink(c => { c.moveTo(-250, -30); c.quadraticCurveTo(-200, 18, 0, 18); c.quadraticCurveTo(220, 18, 270, -20); c.lineTo(290, -70); c.lineTo(300, -66); c.lineTo(276, -6); c.quadraticCurveTo(200, 30, 0, 30); c.quadraticCurveTo(-210, 30, -262, -20); c.lineTo(-300, -40); c.closePath(); }, '#211915', 5);
  ink(rr(-60, -14, 120, 20, 6), '#b8261f', 4);
  line([[150, -10], [200, -150]], 6, '#7a4a25'); // oar left standing in its fork — the gondolier went overboard
  g.restore();
}

// ---------------- below the water ----------------
function underwater() {
  g.fillStyle = lg(0, WL, 0, H, [[0, '#2fa3a0'], [.35, '#1f6f78'], [.75, '#163f4c'], [1, '#0f2a33']]); g.fillRect(0, WL, W, H - WL);
  // surface shimmer + reflection of the sun
  g.fillStyle = 'rgba(255,230,160,.35)'; P(ell(1180, WL + 14, 220, 14)); g.fill();
  for (let i = 0; i < 26; i++) { const x = rnd() * W, y = WL + 6 + rnd() * 26; line([[x, y], [x + 30 + rnd() * 60, y]], 4, 'rgba(255,255,255,.55)'); }
  // god rays from the surface
  g.save(); g.globalCompositeOperation = 'screen';
  for (let i = 0; i < 9; i++) {
    const x = 80 + i * 220 + rnd() * 60;
    P(c => { c.moveTo(x, WL); c.lineTo(x + 70, WL); c.lineTo(x - 60, H); c.lineTo(x - 200, H); c.closePath(); });
    g.fillStyle = 'rgba(160,235,220,.06)'; g.fill();
  }
  g.restore();
}
function pile(x, top, bottom, w, col, dark, lw = 5) {
  ink(c => { c.moveTo(x - w / 2, top); c.lineTo(x + w / 2, top); c.lineTo(x + w / 2, bottom - w); c.lineTo(x, bottom); c.lineTo(x - w / 2, bottom - w); c.closePath(); }, col, lw);
  g.fillStyle = dark; g.fillRect(x + w * .15, top + 4, w * .3, bottom - top - w - 4);
  for (let y = top + 30 + rnd() * 30; y < bottom - w - 10; y += 50 + rnd() * 40) line([[x - w * .35, y], [x - w * .1, y + 10]], 2.5, 'rgba(40,25,15,.55)');
}
function forest() {
  const deck = WL + 20, mudTop = 800;
  // deepest row: silhouettes fading into murk
  for (let x = -20; x < W + 40; x += 56) pile(x + rnd() * 10, deck, 980 + rnd() * 30, 22, '#24555a', '#1d4549', 0);
  // middle row
  seed = 23;
  for (let x = 10; x < W + 40; x += 104) pile(x + rnd() * 16, deck, 1010 + rnd() * 40, 36, '#5f6a52', '#4c5743', 4);
  // murk over the back rows
  g.fillStyle = 'rgba(25,95,105,.42)'; g.fillRect(0, deck, W, H - deck);
  // front row
  seed = 41;
  for (let x = 60; x < W; x += 172) pile(x + rnd() * 20, deck, 1060 + rnd() * 30, 60, '#a77b49', '#8a6338', 5);
  // timber deck + stone under the buildings
  ink(rr(-20, WL - 4, W + 40, 34, 4), '#8a5a30', 6);
  for (let x = 30; x < W; x += 140) line([[x, WL + 2], [x, WL + 24]], 3, 'rgba(40,25,15,.6)');
  // mud bed the piles are driven into
  g.fillStyle = lg(0, mudTop, 0, H, [[0, 'rgba(70,48,28,.0)'], [.25, 'rgba(70,48,28,.85)'], [1, 'rgba(40,26,15,1)']]); g.fillRect(0, mudTop, W, H - mudTop);
  g.fillStyle = 'rgba(30,20,12,.5)';
  for (let i = 0; i < 40; i++) { P(ell(rnd() * W, 880 + rnd() * 200, 10 + rnd() * 30, 4 + rnd() * 6)); g.fill(); }
}
function fish(x, y, s, flip, col) {
  g.save(); g.translate(x, y); g.scale(flip ? -s : s, s);
  ink(c => { c.moveTo(-50, 0); c.quadraticCurveTo(0, -36, 50, 0); c.quadraticCurveTo(0, 36, -50, 0); c.closePath(); }, col, 5);
  ink(c => { c.moveTo(46, 0); c.lineTo(80, -26); c.lineTo(80, 26); c.closePath(); }, col, 5);
  g.fillStyle = '#fff'; P(ell(-26, -6, 9, 9)); g.fill(); g.fillStyle = INK; P(ell(-24, -5, 4, 4)); g.fill();
  g.restore();
}

// ---------------- the gondolier diver ----------------
function diver() {
  const hx = 1480, hy = 640;
  // flashlight beam toward the piles (drawn first, additive)
  g.save(); g.globalCompositeOperation = 'screen';
  P(c => { c.moveTo(1235, 700); c.lineTo(560, 500); c.lineTo(560, 1000); c.closePath(); });
  g.fillStyle = lg(1235, 700, 560, 700, [[0, 'rgba(255,245,190,.75)'], [1, 'rgba(255,240,170,.08)']]); g.fill();
  g.restore();
  // legs, kicking up and back
  [[1530, 900, 1650, 960, 1760, 900], [1560, 880, 1700, 880, 1800, 800]].forEach(([x0, y0, kx, ky, fx, fy]) => {
    line([[x0, y0], [kx, ky], [fx, fy]], 46); line([[x0, y0], [kx, ky], [fx, fy]], 30, '#2b2b2b');
    g.save(); g.translate(fx, fy); g.rotate(Math.atan2(fy - ky, fx - kx));
    ink(c => { c.moveTo(-10, -18); c.lineTo(90, -40); c.lineTo(100, 30); c.lineTo(-10, 18); c.closePath(); }, '#f0c43a', 5);
    g.restore();
  });
  // torso: gondolier's striped shirt
  const torso = c => { c.moveTo(1390, 760); c.quadraticCurveTo(1500, 730, 1590, 770); c.lineTo(1610, 910); c.quadraticCurveTo(1510, 950, 1400, 920); c.closePath(); };
  ink(torso, '#fbf7ef', 7);
  g.save(); P(torso); g.clip();
  for (let y = 760; y < 960; y += 34) { g.fillStyle = '#1e2a52'; g.fillRect(1380, y, 240, 16); }
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(1560, 740, 80, 220);
  g.restore();
  // red sash
  ink(rr(1396, 880, 212, 30, 10), '#c7322a', 5);
  // far arm reaching back
  line([[1580, 790], [1660, 740], [1700, 680]], 30); line([[1580, 790], [1660, 740], [1700, 680]], 18, '#fbf7ef');
  ink(ell(1704, 670, 26, 24), '#fbf7ef', 5);
  // near arm holding the flashlight out at the piles
  line([[1410, 790], [1320, 760], [1260, 720]], 34); line([[1410, 790], [1320, 760], [1260, 720]], 20, '#fbf7ef');
  g.save(); g.translate(1250, 712); g.rotate(Math.atan2(500 - 1000, 0) * 0 + .29 + Math.PI);
  ink(rr(-10, -20, 110, 40, 10), '#d63a2c', 5); ink(rr(-30, -28, 36, 56, 8), '#e9e9e9', 5);
  g.restore();
  ink(ell(1285, 722, 30, 26), '#fbf7ef', 5);
  line([[1272, 712], [1298, 712]], 3.5); line([[1270, 730], [1298, 730]], 3.5);

  // head
  ink(c => { c.moveTo(hx - 165, hy); c.bezierCurveTo(hx - 170, hy - 190, hx + 170, hy - 190, hx + 168, hy); c.bezierCurveTo(hx + 166, hy + 140, hx + 85, hy + 175, hx, hy + 175); c.bezierCurveTo(hx - 90, hy + 175, hx - 162, hy + 140, hx - 165, hy); c.closePath(); }, '#fbf7ef', 8);
  g.fillStyle = 'rgba(120,170,170,.35)'; P(c => { c.moveTo(hx + 110, hy - 70); c.bezierCurveTo(hx + 180, hy + 20, hx + 140, hy + 160, hx + 20, hy + 172); c.bezierCurveTo(hx + 110, hy + 130, hx + 150, hy + 30, hx + 110, hy - 70); }); g.fill();
  // diving mask: yellow frame, glass with huge shocked eyes
  line([[hx - 165, hy - 30], [hx + 168, hy - 30]], 26); line([[hx - 165, hy - 30], [hx + 168, hy - 30]], 14, '#2b2b2b');
  ink(rr(hx - 135, hy - 95, 270, 140, 50), '#f0c43a', 7);
  ink(rr(hx - 112, hy - 76, 224, 102, 38), '#bfe8f0', 5);
  g.save(); P(rr(hx - 112, hy - 76, 224, 102, 38)); g.clip();
  ink(ell(hx - 50, hy - 24, 40, 44), '#ffffff', 5); ink(ell(hx + 52, hy - 24, 40, 44), '#ffffff', 5);
  g.fillStyle = INK; P(ell(hx - 64, hy - 20, 11, 13)); g.fill(); P(ell(hx + 38, hy - 20, 11, 13)); g.fill();
  g.fillStyle = 'rgba(255,255,255,.7)'; P(c => { c.moveTo(hx - 100, hy - 70); c.lineTo(hx - 60, hy - 70); c.lineTo(hx - 110, hy + 10); c.lineTo(hx - 120, hy - 20); c.closePath(); }); g.fill();
  g.restore();
  // brows popping above the mask
  line([[hx - 100, hy - 120], [hx - 30, hy - 138]], 11); line([[hx + 30, hy - 138], [hx + 100, hy - 120]], 11);
  // mouth: gasping O — and losing his breath
  ink(ell(hx + 4, hy + 112, 38, 44), '#7a2420', 7);
  g.fillStyle = '#e8726a'; P(ell(hx + 4, hy + 135, 24, 16)); g.fill();
  // snorkel
  ink(c => { c.moveTo(hx + 150, hy + 80); c.lineTo(hx + 190, hy + 80); c.lineTo(hx + 190, hy - 190); c.lineTo(hx + 165, hy - 190); c.lineTo(hx + 165, hy + 55); c.closePath(); }, '#d63a2c', 5);
  // bubbles from the mouth
  [[hx - 70, hy + 120, 12], [hx - 140, hy + 60, 18], [hx - 200, hy - 40, 14], [hx - 190, hy - 140, 24]].forEach(([x, y, r]) => {
    ink(ell(x, y, r, r), 'rgba(220,250,255,.35)', 3.5); g.fillStyle = 'rgba(255,255,255,.9)'; P(ell(x - r * .35, y - r * .35, r * .25, r * .25)); g.fill();
  });
  // straw boater hat floating up toward the surface
  g.save(); g.translate(1770, 560); g.rotate(-.5);
  ink(ell(0, 0, 120, 26), '#f1d27a', 6);
  ink(c => { c.moveTo(-70, 0); c.lineTo(-64, -62); c.quadraticCurveTo(0, -76, 64, -62); c.lineTo(70, 0); c.closePath(); }, '#f1d27a', 6);
  ink(rr(-67, -30, 134, 22, 4), '#c7322a', 4);
  for (let k = -3; k <= 3; k++) line([[k * 30, -6], [k * 30 + 8, 8]], 2.5, 'rgba(140,100,30,.5)');
  g.restore();
}

// ---------------- title ----------------
function title(text, x, y, size, fill, rot) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.font = `${size}px Lucky`; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
  g.fillStyle = INK; g.strokeStyle = INK; g.lineWidth = size * .24;
  g.strokeText(text, 10, 16); g.fillText(text, 10, 16);
  g.lineWidth = size * .2; g.strokeText(text, 0, 0);
  g.fillStyle = fill; g.fillText(text, 0, 0);
  g.save(); g.beginPath(); g.rect(-20, -size, 3000, size * .42); g.clip();
  g.fillStyle = 'rgba(255,255,255,.35)'; g.fillText(text, 0, 0); g.restore();
  g.restore();
}
function badge() {
  g.save(); g.translate(330, 930); g.rotate(-.04);
  ink(rr(-270, -54, 540, 108, 20), '#d6281e', 7);
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 4; g.setLineDash([12, 9]); P(rr(-256, -42, 512, 84, 14)); g.stroke(); g.setLineDash([]);
  g.font = '54px Lucky'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  g.fillText('MILLIONS OF TREES', 0, 8);
  g.restore();
  // arrow from the badge up to the piles
  g.save(); g.translate(560, 860);
  line([[0, 0], [60, -40], [110, -120]], 26); line([[0, 0], [60, -40], [110, -120]], 13, '#ffd21f');
  ink(c => { c.moveTo(80, -110); c.lineTo(122, -165); c.lineTo(140, -98); c.closePath(); }, '#ffd21f', 5);
  g.restore();
}
function grade() {
  g.fillStyle = rg(W / 2, H / 2, 350, 1200, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(10,20,25,.55)']]); g.fillRect(0, 0, W, H);
  const img = g.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - .5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(img, 0, 0);
}

document.fonts.load('100px Lucky').then(() => {
  sky(); skyline(); underwater(); forest();
  fish(250, 640, .9, false, '#f29a3a'); fish(1050, 950, .7, true, '#f2d03a'); fish(840, 600, .55, false, '#f29a3a');
  diver();
  grade();
  title("WHAT'S REALLY", 64, 190, 150, '#ffffff', -.04);
  title('UNDER VENICE?', 50, 400, 205, lg(0, -200, 0, 0, [[0, '#fff36a'], [1, '#ffc21a']]), -.04);
  badge();
  window.DONE = true;
});
</script>
